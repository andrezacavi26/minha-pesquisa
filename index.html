<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Minha Pesquisa</title>
    <meta name="description" content="Acompanhe sua trajetória acadêmica e de pesquisa: prazos, experimentos, orientação, disciplinas e acervo." />
    <meta name="theme-color" content="#0a2a2c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a2a2c%22/%3E%3Cg%20transform%3D%22translate%284%2018%29%22%3E%3Ccircle%20cx%3D%224%22%20cy%3D%2222%22%20r%3D%223.2%22%20fill%3D%22%233ee8b5%22/%3E%3Cpath%20d%3D%22M10%2022c4-16%208-16%2011%200s7%2016%2011%200%207-16%2011%200%207%2012%2010%204%22%20fill%3D%22none%22%20stroke%3D%22%233ee8b5%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
/* ===== Minha Pesquisa — estilos ===== */
:root {
  --ink: #0d2122;
  --ink-2: #33494a;
  --muted: #627677;
  --line: #d8e7e5;
  --bg: #eef5f4;
  --card: #ffffff;
  --deep: #0a2a2c;
  --deep-2: #0d3b3c;
  --mint: #3ee8b5;
  --mint-2: #20c997;
  --mint-ink: #0b7a5c;
  --mint-soft: #d6faec;
  --mint-softer: #ecfcf6;
  --late: #d9474f;
  --late-soft: #fde8e9;
  --soon: #c98208;
  --soon-soft: #fff3dc;
  --near: #1f8a7a;
  --near-soft: #e0f4f1;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(10, 42, 44, 0.05), 0 6px 20px rgba(10, 42, 44, 0.06);
  --font: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15.5px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--mint-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
.ico { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.pre { white-space: pre-line; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; border-radius: 8px; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 24px;
  padding: 12px clamp(16px, 3vw, 40px);
  background: var(--deep);
  color: #fff;
}
.brand { display: flex; align-items: center; gap: 14px; color: #fff; text-decoration: none; }
.brand-mark { width: 52px; height: 24px; fill: var(--mint); stroke: var(--mint); }
.brand-mark.big { width: 96px; height: 42px; }
.brand-sep { width: 1px; height: 28px; background: rgba(255,255,255,.35); }
.brand-name { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.nav { display: flex; gap: 6px; margin: 0 auto; }
.nav-link {
  color: #e6f4f2; text-decoration: none; font-weight: 500;
  padding: 8px 18px; border-radius: 999px; white-space: nowrap;
  transition: background .15s;
}
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link.active { background: var(--mint); color: var(--deep); font-weight: 600; box-shadow: 0 0 24px rgba(62,232,181,.35); }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--mint), #1fa6a0);
  color: var(--deep); font-weight: 700; text-decoration: none;
  border: 2px solid rgba(255,255,255,.6);
}
.bottom-nav { display: none; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(1200px 400px at 75% 60%, rgba(62,232,181,.25), transparent 60%),
    radial-gradient(600px 300px at 10% 0%, rgba(31,166,160,.35), transparent 60%),
    linear-gradient(120deg, #072628 0%, #0b3c3d 55%, #0a4a47 100%);
  color: #fff;
}
.hero::after {
  content: ''; position: absolute; inset: auto 0 0 0; height: 60px;
  background: linear-gradient(90deg, transparent, rgba(62,232,181,.18), transparent);
  filter: blur(20px);
}
.hero-inner {
  max-width: 1280px; margin: 0 auto;
  padding: clamp(28px, 5vw, 56px) clamp(16px, 3vw, 40px);
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center;
}
.eyebrow { font-size: 17px; color: #d4efeb; margin-bottom: 10px; }
.eyebrow::after { content: ''; display: block; width: 52px; height: 5px; border-radius: 3px; background: var(--mint); margin-top: 10px; }
.eyebrow.dark { color: var(--mint-ink); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
.eyebrow.dark::after { display: none; }
.hero h1 { font-size: clamp(34px, 5.2vw, 64px); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 16px 0 18px; color: #cfe9e5; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-art svg { width: 100%; max-height: 260px; filter: drop-shadow(0 10px 30px rgba(62,232,181,.25)); }
.link-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 4px 0;
  color: #fff; font-size: 18px; font-weight: 500;
  border-bottom: 3px solid var(--mint);
}
.link-btn.dark { color: var(--mint-ink); font-size: 14px; border-bottom-width: 2px; }

/* ---------- Layout ---------- */
.page { max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 40px) 64px; }
.page.narrow { max-width: 820px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; }
.page-head .eyebrow { margin-bottom: 6px; }
.page-head .muted { margin-top: 6px; }
.head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.grid-today { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 36px; align-items: start; }
.grid-2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.grid-3 > .col { padding: 0 28px; border-left: 1px solid var(--line); }
.grid-3 > .col:first-child { padding-left: 0; border-left: 0; }
.grid-3 > .col:last-child { padding-right: 0; }
.cards-3 { gap: 20px; margin-bottom: 28px; }
.section { margin-bottom: 32px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head h2, .col-head h2 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; gap: 8px; }
.col-head h2 { font-size: clamp(20px, 2vw, 28px); font-weight: 800; }
.sub { font-size: 17px; font-weight: 700; margin: 20px 0 10px; color: var(--ink-2); }
.card .sub:first-child { margin-top: 0; }
.mini-link { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; color: var(--mint-ink); text-decoration: none; white-space: nowrap; }
.mini-link .ico { width: 15px; height: 15px; }
.small-note { margin-top: 14px; font-size: 13.5px; }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
}
.card.soft { background: var(--mint-softer); box-shadow: none; border-color: #c9efe0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; }
.card-head h2 { font-size: 22px; font-weight: 700; }
.card-head .muted { font-size: 14px; margin-top: 2px; }
.card-today { border-color: #bfeedd; background: linear-gradient(180deg, #fff, #f7fefb); }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 15px;
  border: 1px solid transparent; transition: transform .05s, background .15s, box-shadow .15s;
  text-decoration: none; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.lg { padding: 14px 22px; font-size: 16px; }
.btn.full { width: 100%; }
.btn-primary { background: var(--mint); color: var(--deep); box-shadow: 0 4px 14px rgba(62,232,181,.35); }
.btn-primary:hover { background: #5cf0c3; }
.btn-soft { background: var(--mint-soft); color: #0b5a45; border-color: #b6eed8; }
.btn-soft:hover { background: #c4f6e2; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: #a9cfc8; }
.btn-ghost-light { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
.btn-ghost-light:hover { background: rgba(255,255,255,.08); }
.btn-danger { background: var(--late); color: #fff; }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--bg); color: var(--ink); border-color: var(--line); }
.icon-btn.danger:hover { color: var(--late); background: var(--late-soft); border-color: #f6c6c9; }
.row-actions { display: flex; gap: 2px; flex: none; }
.file-btn { cursor: pointer; }

/* ---------- Badges / pílulas ---------- */
.badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; vertical-align: middle; }
.badge-late { background: var(--late-soft); color: var(--late); }
.badge-soon { background: var(--soon-soft); color: var(--soon); }
.badge-near { background: var(--near-soft); color: var(--near); }
.badge-ok { background: #eef2f2; color: var(--muted); }
.badge-done { background: var(--mint-soft); color: var(--mint-ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #eef4f3; color: var(--ink-2); text-decoration: none; }
.pill .ico { width: 14px; height: 14px; }
.pill.link { background: var(--mint-soft); color: #0b5a45; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; color: #0b5a45; background: var(--mint-soft); border-radius: 6px; padding: 1px 7px; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.status-concluida { color: var(--mint-ink); }
.status-cursando { color: var(--soon); }
.status-planejada { color: var(--muted); }
.pill.status-concluida { background: var(--mint-soft); }
.pill.status-cursando { background: var(--soon-soft); }
.hint-warn { font-size: 12.5px; color: var(--soon); font-weight: 600; }

/* ---------- Barras ---------- */
.bar { height: 10px; border-radius: 999px; background: #e3eeec; overflow: hidden; margin: 6px 0 10px; }
.bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint-2), var(--mint)); transition: width .4s ease; }
.bar-time span { background: linear-gradient(90deg, #3c6e70, #6ea3a2); }
.bar-warn span { background: linear-gradient(90deg, #e4a33c, #f3c56b); }
.pace-row { display: flex; justify-content: space-between; font-size: 14.5px; color: var(--ink-2); }
.pace-msg { margin-top: 6px; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; font-weight: 500; }
.tone-good { background: var(--mint-softer); color: #0b5a45; }
.tone-warn { background: var(--soon-soft); color: #8a5a06; }
.tone-bad { background: var(--late-soft); color: #9b2b31; }
.tone-neutral { background: #eef4f3; color: var(--muted); }

/* ---------- Hoje ---------- */
.today-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.today-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
  border-left: 4px solid var(--line);
}
.today-item.u-late { border-left-color: var(--late); }
.today-item.u-soon { border-left-color: var(--soon); }
.ti-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ti-body small { color: var(--muted); }
.kind-dot { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
.kind-dot::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--mint-2); }
.checkbox {
  width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid #9fc9c1; background: #fff;
  display: grid; place-items: center; padding: 0; color: var(--deep);
}
.checkbox:hover { border-color: var(--mint-2); background: var(--mint-softer); }
.checkbox.checked { background: var(--mint); border-color: var(--mint); }
.checkbox .ico { width: 14px; height: 14px; stroke-width: 3; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.quick .btn { font-size: 14px; padding: 8px 12px; }

.meeting-mini { display: flex; gap: 14px; align-items: flex-start; }
.meeting-mini .muted { margin-top: 6px; font-size: 14px; }
.date-chip {
  flex: none; width: 54px; padding: 6px 0; border-radius: 12px; text-align: center;
  background: var(--deep); color: #fff; display: flex; flex-direction: column; line-height: 1.1;
}
.date-chip b { font-size: 22px; }
.date-chip span { font-size: 12px; text-transform: uppercase; color: var(--mint); }
.date-chip.small { width: 46px; }
.date-chip.small b { font-size: 18px; }

/* ---------- Tiles (colunas da home) ---------- */
.tile-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 14px; background: #fff;
  border: 1px solid var(--line); box-shadow: var(--shadow);
  color: var(--ink); text-decoration: none; font-weight: 500; font-size: 16.5px;
}
a.tile:hover, .tile.ghost:hover { border-color: #a6e5cf; }
.tile > .ico { width: 26px; height: 26px; color: var(--mint-ink); }
.tile > span:not(.tile-ico):not(.tile-main) { flex: 1; }
.tile small { color: var(--muted); font-size: 13px; font-weight: 500; }
.tile.ghost { background: var(--mint-soft); border-color: #b6eed8; box-shadow: none; color: #0b5a45; cursor: pointer; }
.tile-ico {
  width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(145deg, #dffbf0, #b5f0da); color: #0b6f53;
}
.tile-ico .ico { width: 24px; height: 24px; }
.tile-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tile-arrow { color: var(--ink-2); }

.exp-rail { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; display: flex; flex-direction: column; gap: 12px; }
.exp-rail::before { content: ''; position: absolute; left: 8px; top: 24px; bottom: 24px; width: 2px; background: #a6e5cf; }
.exp-rail li { position: relative; }
.exp-rail li::before {
  content: ''; position: absolute; left: -26px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--mint-2);
}
.exp-rail li.is-active::before { background: var(--mint); box-shadow: 0 0 0 5px rgba(62,232,181,.25); }
.exp-rail li.is-done::before { background: var(--mint-2); }
.exp-rail li.is-active .tile { background: var(--mint-softer); border-color: #a6e5cf; border-left: 4px solid var(--mint); }

/* ---------- Experimentos ---------- */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px; }
.exp-card { display: flex; flex-direction: column; gap: 12px; }
.exp-head { display: flex; gap: 12px; align-items: flex-start; }
.exp-title { flex: 1; min-width: 0; }
.exp-title h3 { font-size: 18px; margin-bottom: 4px; }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stage {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); background: #f6faf9;
  font-size: 13.5px; font-weight: 600; color: var(--muted);
}
.stage-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #b9cfcb; display: grid; place-items: center; flex: none; }
.stage-dot .ico { width: 11px; height: 11px; stroke-width: 3.2; }
.stage.st-doing { background: #fff8e8; border-color: #f2d59b; color: #8a5a06; }
.stage.st-doing .stage-dot { border-color: var(--soon); background: radial-gradient(circle, var(--soon) 35%, transparent 40%); }
.stage.st-done { background: var(--mint-soft); border-color: #a6e5cf; color: #0b5a45; }
.stage.st-done .stage-dot { background: var(--mint-2); border-color: var(--mint-2); color: #fff; }
.stage:hover { filter: brightness(.98); border-color: #9fc9c1; }
.exp-card .bar { margin: 0; }
.exp-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); align-items: center; }
.exp-foot > * { display: inline-flex; align-items: center; gap: 5px; }
.exp-foot a { color: var(--muted); text-decoration: none; }
.exp-foot a:hover { color: var(--mint-ink); }
.exp-foot .ico { width: 15px; height: 15px; }
.exp-foot .link-btn { margin-left: auto; }

/* ---------- Listas / linhas ---------- */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px;
}
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-main strong { font-weight: 600; }
.row-main a { color: var(--ink); text-decoration-color: #9fdcc6; }
.row-main small { font-size: 13px; }
.row.is-done .row-main strong { text-decoration: line-through; color: var(--muted); }
.agenda-row.u-late { border-left: 4px solid var(--late); }
.agenda-row.u-soon { border-left: 4px solid var(--soon); }
.late-box { border-color: #f6c6c9; background: #fffafa; margin-bottom: 24px; }
.late-box h3 { display: flex; gap: 8px; align-items: center; color: var(--late); margin-bottom: 12px; font-size: 17px; }
.month { margin-bottom: 22px; }
.month-title { font-size: 15px; color: var(--ink-2); margin: 0 0 10px; font-weight: 700; }
.between { margin-top: 8px; }

.log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.log { display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.log-date { width: 48px; flex: none; text-align: center; display: flex; flex-direction: column; line-height: 1.1; color: var(--ink-2); }
.log-date b { font-size: 22px; }
.log-date span { font-size: 12px; text-transform: uppercase; color: var(--muted); }
.log-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.log-issue { color: #8a5a06; font-size: 14px; }
.log-next { color: var(--mint-ink); font-size: 14px; font-weight: 500; }
.select-sm { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; max-width: 220px; }

.ethics { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.ethics-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.ethics .bar { margin: 0; }

/* ---------- Orientação ---------- */
.prep { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-bottom: 28px; background: linear-gradient(120deg, #0b3536, #0f4746); color: #fff; border: 0; }
.prep h2 { font-size: 22px; margin-bottom: 8px; }
.prep .muted { color: #bfe0db; }
.prep .badge-ok { background: rgba(255,255,255,.12); color: #e0f3f0; }
.prep-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.prep-cols > div { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
.prep-cols h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--mint); margin-bottom: 6px; }
.prep .link-btn.dark { color: var(--mint); margin-top: 8px; }
.meeting { margin-bottom: 12px; }
.meeting-top { display: flex; gap: 12px; align-items: center; }
.meeting-block { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14.5px; }
.meeting-block h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }

/* ---------- Linha do curso ---------- */
.course-line { margin-bottom: 28px; padding: 22px 24px 52px; }
.cl-head { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); margin-bottom: 30px; }
.cl-track { position: relative; height: 12px; border-radius: 999px; background: #e3eeec; }
.cl-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, #6ea3a2, var(--mint)); }
.cl-year { position: absolute; top: 20px; transform: translateX(-50%); font-size: 12px; color: var(--muted); }
.cl-year::before { content: ''; position: absolute; left: 50%; top: -14px; width: 1px; height: 8px; background: #b9cfcb; }
.cl-now { position: absolute; top: -8px; width: 3px; height: 28px; background: var(--deep); border-radius: 2px; transform: translateX(-50%); }
.cl-now span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11.5px; font-weight: 700; background: var(--deep); color: var(--mint); padding: 1px 6px; border-radius: 6px; }
.cl-mark {
  position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%;
  transform: translate(-50%, -50%); background: #fff; border: 3px solid var(--near); padding: 0;
}
.cl-mark.done { background: var(--mint-2); border-color: var(--mint-2); }
.cl-mark.u-soon, .cl-mark.u-late { border-color: var(--soon); }
.cl-label {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  font-size: 11.5px; white-space: nowrap; color: var(--ink-2); background: #fff; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .15s;
}
.cl-mark:hover .cl-label, .cl-mark:focus-visible .cl-label { opacity: 1; }

/* ---------- Tabela ---------- */
.table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; }
.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th { text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #f7fbfa; }
.table td { padding: 10px 16px; border-bottom: 1px solid #edf3f2; }
.table tr:last-child td { border-bottom: 0; }
.table a { color: var(--ink); }
.credits-card { max-width: 520px; }
.credits-split { max-width: none; display: grid; grid-template-columns: 1fr 1fr auto; gap: 24px; align-items: center; }
.credit-block .bar { margin: 6px 0 4px; }
.credit-total { display: flex; flex-direction: column; align-items: flex-end; padding-left: 24px; border-left: 1px solid #c9efe0; min-width: 130px; }
.credit-total span { font-size: 14px; color: var(--ink-2); }
.credit-total b { font-size: 26px; line-height: 1.1; }
.pill.type-obrigatoria { background: #e4edf7; color: #2d4f7a; }
.pill.type-optativa { background: #f1e9fb; color: #5f3c8c; }
.link-inline { background: none; border: 0; padding: 0; color: var(--mint-ink); font-weight: 600; text-decoration: underline; }
@media (max-width: 700px) { .credits-split { grid-template-columns: 1fr; } .credit-total { align-items: flex-start; padding-left: 0; border-left: 0; } }

/* ---------- Acervo ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.tab {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: -1px;
  color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent;
}
.tab.active { color: var(--ink); border-bottom-color: var(--mint); }
.count { font-size: 12px; background: #e6efee; color: var(--ink-2); padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.kanban { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: #e6f0ee; border-radius: 14px; padding: 12px; min-height: 140px; display: flex; flex-direction: column; gap: 10px; }
.kcol h3 { font-size: 14px; display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); }
.kcard { padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.kcard small { font-size: 12.5px; }
.kfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.kfoot .icon-btn { width: 28px; height: 28px; }
.kfoot .ico { width: 15px; height: 15px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.cards-grid p { margin-top: 8px; }
.sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.sum b { font-size: 20px; margin-right: 4px; }

/* ---------- Config ---------- */
.setting { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 14px; }
.setting h3 { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 4px; }
.setting .muted { font-size: 14.5px; }
.danger-zone { border-color: #f6c6c9; }

/* ---------- Vazio ---------- */
.empty { border: 1.5px dashed #b9dcd4; border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; background: rgba(255,255,255,.5); }
.empty.small { padding: 16px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(6, 26, 27, .55);
  display: grid; place-items: center; padding: 16px; animation: fade .15s ease;
}
.modal {
  width: min(640px, 100%); max-height: calc(100dvh - 32px); overflow: auto;
  background: #fff; border-radius: 20px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  animation: pop .18s ease;
}
.modal-sm { width: min(420px, 100%); }
.modal-lg { width: min(820px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-size: 22px; }
.modal-foot { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.confirm-text { font-size: 17px; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.field.full, .check.full { grid-column: 1 / -1; }
.field em { color: var(--late); font-style: normal; }
.field small { font-weight: 400; color: var(--muted); }
.field input, .field select, .field textarea, .lattes {
  font: inherit; font-weight: 400; font-size: 15px; color: var(--ink);
  border: 1px solid #c9dcd9; border-radius: 10px; padding: 10px 12px; background: #fbfdfd; width: 100%;
}
.field textarea, .lattes { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--mint-2); box-shadow: 0 0 0 3px rgba(62,232,181,.25); background: #fff; }
.field .invalid { border-color: var(--late); box-shadow: 0 0 0 3px rgba(217,71,79,.15); }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; align-self: end; padding-bottom: 10px; }
.check input { width: 18px; height: 18px; accent-color: var(--mint-2); }
.lattes { margin: 12px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.55; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 60;
  background: var(--deep); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); opacity: 0; transition: all .2s ease; border-left: 4px solid var(--mint);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Boas-vindas ---------- */
.welcome {
  min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(900px 500px at 80% 70%, rgba(62,232,181,.25), transparent 60%),
    linear-gradient(130deg, #072628, #0b3c3d 60%, #0a4a47);
  color: #fff;
}
.welcome-card { max-width: 560px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.welcome-card .brand-mark { fill: var(--mint); stroke: var(--mint); }
.welcome h1 { font-size: clamp(38px, 6vw, 60px); font-weight: 800; }
.welcome p { font-size: 18px; color: #d4efeb; }
.welcome small { color: #a6cbc6; }
.welcome-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }

/* ---------- Responsivo ---------- */
@media (max-width: 1100px) {
  .nav-link { padding: 8px 12px; }
  .brand-name { font-size: 19px; }
  .kanban { grid-template-columns: repeat(6, 220px); }
}
@media (max-width: 960px) {
  .grid-today, .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; gap: 36px; }
  .grid-3 > .col { padding: 0; border-left: 0; }
  .cards-3 { gap: 14px; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .prep { grid-template-columns: 1fr; }
  .nav { display: none; }
  .topbar { justify-content: space-between; }
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--deep); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; min-width: 56px;
    color: #a9c9c5; text-decoration: none; font-size: 11.5px; font-weight: 500; border-radius: 10px;
  }
  .bottom-nav a .ico { width: 22px; height: 22px; }
  .bottom-nav a.active { color: var(--mint); background: rgba(62,232,181,.1); }
  .page { padding-bottom: 110px; }
  .toast { bottom: 90px; }
}
@media (max-width: 600px) {
  body { font-size: 15px; }
  .brand-name { font-size: 18px; }
  .brand-mark { width: 40px; }
  .form-grid { grid-template-columns: 1fr; }
  .exp-grid, .cards-grid { grid-template-columns: 1fr; }
  .stages { grid-template-columns: repeat(2, 1fr); }
  .setting { flex-direction: column; align-items: stretch; }
  .page-head .btn-primary { width: 100%; }
  .row { flex-wrap: wrap; }
  .modal { padding: 18px; border-radius: 18px; }
  .exp-foot .link-btn { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ===== Sub-abas do Planejamento ===== */
.subtabs { display: flex; width: fit-content; gap: 4px; padding: 4px; background: #e2eeec; border-radius: 14px; margin: -8px 0 26px; flex-wrap: wrap; }
.subtab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; }
.subtab:hover { background: rgba(255,255,255,.6); }
.subtab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(10,42,44,.12); }
.subtab.active .ico { color: var(--mint-ink); }
.ico.flip { transform: scaleX(-1); }

/* ===== Desenhos ===== */
.drawing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.drawing-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; text-decoration: none; color: var(--ink); }
.drawing-card:hover { border-color: #a6e5cf; }
.drawing-card .thumb { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; margin-bottom: 6px; background: #fff; }
.thumb-svg { width: 100%; height: 100%; display: block; }

.editor-page { display: flex; flex-direction: column; height: calc(100dvh - 66px); background: #e9f1f0; }
.editor-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.editor-title { font: inherit; font-size: 19px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; min-width: 200px; flex: 1; max-width: 460px; background: transparent; color: var(--ink); }
.editor-title:hover, .editor-title:focus { border-color: var(--line); background: #fbfdfd; outline: none; }
.editor-head .head-actions { margin-left: auto; }
.save-state { font-size: 13px; color: var(--muted); }
.editor-body { flex: 1; display: grid; grid-template-columns: 56px 1fr 280px; min-height: 0; }
.toolbar { display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; background: #fff; border-right: 1px solid var(--line); overflow-y: auto; }
.tool { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; color: var(--ink-2); padding: 0; flex: none; }
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--bg); }
.tool.active { background: var(--mint-soft); border-color: #a6e5cf; color: #0b5a45; }
.tool:disabled { opacity: .35; cursor: default; background: transparent; }
.tool-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.canvas-wrap { position: relative; overflow: auto; padding: 24px; display: flex; align-items: flex-start; justify-content: center; }
#dr-svg { width: 100%; max-width: 1400px; aspect-ratio: 16 / 9; height: auto; background: #fff; box-shadow: 0 2px 12px rgba(10,42,44,.12); border-radius: 4px; touch-action: none; user-select: none; }
.inline-text { position: absolute; z-index: 5; border: 2px solid var(--mint-2); border-radius: 6px; background: rgba(255,255,255,.96); font-family: var(--font); text-align: center; padding: 6px; resize: none; outline: none; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.props { background: #fff; border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; font-size: 14px; }
.props h3 { font-size: 17px; margin-bottom: 8px; }
.props h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
.props .btn { margin-bottom: 8px; font-size: 14px; }
.props textarea, .props select, .props input[type="number"] { font: inherit; font-size: 14px; border: 1px solid #c9dcd9; border-radius: 8px; padding: 6px 8px; width: 100%; background: #fbfdfd; }
.props textarea { resize: vertical; }
.prop-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.prop-row label { display: flex; align-items: center; gap: 8px; flex: 1; font-weight: 600; color: var(--ink-2); }
.prop-row input[type="range"] { flex: 1; accent-color: var(--mint-2); }
.prop-row input[type="number"] { width: 72px; }
.check-inline { flex: none !important; font-weight: 500 !important; }
.prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.prop-grid .btn { margin: 0; padding: 8px 6px; font-size: 13px; }
.danger-text { color: var(--late) !important; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.sw { width: 100%; aspect-ratio: 1; border-radius: 7px; border: 1px solid #c9dcd9; padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--mint-2); outline-offset: 1px; }
.sw.none { background: linear-gradient(135deg, #fff 45%, var(--late) 45%, var(--late) 55%, #fff 55%); }
.sw.custom { display: grid; place-items: center; overflow: hidden; cursor: pointer; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.sw.custom input { opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.editor-hint { font-size: 12.5px; color: var(--muted); padding: 6px 16px; background: #fff; border-top: 1px solid var(--line); margin: 0; }
@media (max-width: 960px) {
  .editor-page { height: auto; min-height: calc(100dvh - 66px); }
  .editor-body { grid-template-columns: 1fr; }
  .toolbar { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  .tool-sep { width: 1px; height: auto; margin: 4px 6px; }
  .canvas-wrap { padding: 12px; }
  .props { border-left: 0; border-top: 1px solid var(--line); }
  .editor-hint { display: none; }
}

/* ===== Planejamento acadêmico ===== */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-bottom: 8px; }
.course-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); }
.course-card:hover { border-color: #a6e5cf; transform: translateY(-1px); }
.course-card .bar { margin: 0; }
.course-top { display: flex; gap: 12px; align-items: flex-start; }
.course-title { flex: 1; min-width: 0; }
.course-title h3 { font-size: 17px; margin-bottom: 2px; }
.course-card .small { display: flex; align-items: center; gap: 6px; }
.course-card .small .ico { width: 15px; height: 15px; }
.course-stats { display: grid; grid-template-columns: auto auto 1fr; gap: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
.course-stats div { display: flex; flex-direction: column; min-width: 0; }
.course-stats div > span:first-child { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.course-stats .badge { width: fit-content; margin-top: 2px; }
.course-stats b { font-size: 15px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-link { display: flex; width: fit-content; align-items: center; gap: 6px; color: var(--mint-ink); font-weight: 600; text-decoration: none; margin-bottom: 14px; }
.course-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.course-name { font-size: clamp(24px, 3vw, 32px); font-weight: 800; margin-bottom: 4px; }
.course-head .chips { margin-top: 8px; }
.course-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; }
.course-meta, .course-meta a { align-items: center; }
.course-meta .ico { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 16px; }
.stat > span { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat > b { font-size: 28px; line-height: 1.1; }
.stat .stat-next { font-size: 17px; line-height: 1.3; }
.stat .bar { margin: 6px 0 0; }
.add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 8px; flex: none; min-width: 120px; }
.kind .ico { width: 15px; height: 15px; }
.kind-prova { background: #fde8e9; color: #9b2b31; }
.kind-trabalho { background: #e4edf7; color: #2d4f7a; }
.kind-apresentacao { background: #f1e9fb; color: #5f3c8c; }
.kind-outro { background: #eef4f3; color: var(--ink-2); }
.assess-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 110px; }
.assess-nums { display: flex; flex-direction: column; align-items: center; min-width: 52px; }
.assess-nums small { font-size: 11.5px; color: var(--muted); text-transform: uppercase; }
.row.assess.is-done .kind { opacity: .6; }
@media (max-width: 960px) { .stat-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) {
  .course-grid { grid-template-columns: 1fr; }
  .kind { min-width: 0; }
  .assess-meta { align-items: flex-start; min-width: 0; }
}

/* ===== Biblioteca de artigos ===== */
.lib-search { display: grid; grid-template-columns: 1.6fr auto 1fr; gap: 22px; align-items: start; margin-bottom: 26px; }
.lib-form, .lib-lookup { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lib-q { display: flex; gap: 8px; align-items: center; border: 1px solid #c9dcd9; border-radius: 12px; padding: 4px 4px 4px 12px; background: #fbfdfd; }
.lib-q:focus-within { border-color: var(--mint-2); box-shadow: 0 0 0 3px rgba(62,232,181,.25); background: #fff; }
.lib-q > .ico { color: var(--muted); }
.lib-q input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; padding: 8px 0; outline: none; color: var(--ink); }
.lib-q .btn { padding: 9px 16px; }
.lib-opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; background: #e6efee; border-radius: 10px; padding: 3px; }
.seg label { padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg label.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(10,42,44,.12); }

// Conexão com o Supabase (login e dados na nuvem).
// A chave publicável pode ficar no código: quem protege os dados são as regras de
// Row Level Security do banco (cada pessoa só lê e grava os próprios dados).
// Se ficar vazio, o sistema funciona só no navegador.
const SUPABASE_URL = 'https://zazsawtgvyiucorkbmow.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8s4lMxa1KvTyG6aXVRhgbw_ZA29-LGL';

return { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JS };

// ===== js/store.js =====
const __m_store = (() => {
// Camada de dados: tudo fica no localStorage do navegador.
// Fase 2: trocar por Supabase mantendo a mesma interface (get/add/update/remove).

const KEY = 'minhapesquisa:v1';

const COLLECTIONS = [
  'milestones', // prazos e marcos
  'experiments', // experimentos (planejamento)
  'logs', // diário de bancada
  'protocols', // POPs
  'ethics', // CEUA / CEP
  'meetings', // reuniões com orientador
  'tasks', // tarefas
  'courses', // disciplinas
  'certificates',
  'congresses',
  'papers', // produção / artigos
  'links', // modelos, templates, artigos e links
  'assessments', // provas, trabalhos e apresentações de cada disciplina
  'drawings', // desenhos experimentais
  'articles', // biblioteca de artigos (PubMed, SciELO, manual)
];

function empty() {
  const s = { version: 1, profile: null };
  COLLECTIONS.forEach((c) => (s[c] = []));
  return s;
}

let state = load();
const listeners = new Set();
const persistHooks = new Set(); // chamados em todo salvamento (inclusive silencioso): usado pela sincronização

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return empty();
    const parsed = JSON.parse(raw);
    const base = empty();
    return { ...base, ...parsed };
  } catch (e) {
    console.warn('Não foi possível ler os dados salvos', e);
    return empty();
  }
}

// origin: 'local' (mudança feita aqui) ou 'cloud' (veio da nuvem, não precisa reenviar)
function persist(silent = false, origin = 'local') {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Não foi possível salvar', e);
  }
  persistHooks.forEach((fn) => fn(state, origin));
  if (!silent) listeners.forEach((fn) => fn(state));
}

const uid = () =>
  Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const store = {
  get: () => state,
  list: (col) => state[col] || [],
  find: (col, id) => (state[col] || []).find((x) => x.id === id),
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  onPersist(fn) {
    persistHooks.add(fn);
    return () => persistHooks.delete(fn);
  },
  setProfile(profile) {
    state.profile = { ...(state.profile || {}), ...profile };
    persist();
  },
  add(col, obj) {
    const item = { id: uid(), createdAt: new Date().toISOString(), ...obj };
    state[col] = [...(state[col] || []), item];
    persist();
    return item;
  },
  // silent: salva sem redesenhar a tela (usado pelo editor de desenhos)
  update(col, id, patch, { silent = false } = {}) {
    state[col] = state[col].map((x) => (x.id === id ? { ...x, ...patch } : x));
    persist(silent);
  },
  removeWhere(col, fn) {
    state[col] = state[col].filter((x) => !fn(x));
    persist();
  },
  remove(col, id) {
    state[col] = state[col].filter((x) => x.id !== id);
    persist();
  },
  replaceAll(next, { origin = 'local' } = {}) {
    state = { ...empty(), ...next };
    persist(false, origin);
  },
  reset({ origin = 'local' } = {}) {
    state = empty();
    persist(false, origin);
  },
  hasContent() {
    return !!state.profile || COLLECTIONS.some((c) => (state[c] || []).length);
  },
};

return { COLLECTIONS, uid, store };
})();

const esc = (v) =>

// ---------- Datas ----------
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function parse(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function daysUntil(iso) {
  const d = parse(iso);
  if (!d) return null;
  const t = parse(todayISO());
  return Math.round((d - t) / 86400000);
}

function fmtDate(iso, opts = { day: '2-digit', month: 'short', year: 'numeric' }) {
  const d = parse(iso);
  return d ? d.toLocaleDateString('pt-BR', opts).replace('.', '') : '—';
}

function relDays(iso) {
  const n = daysUntil(iso);
  if (n === null) return '';
  if (n === 0) return 'hoje';
  if (n === 1) return 'amanhã';
  if (n === -1) return 'ontem';
  if (n < 0) return `há ${-n} dias`;
  if (n < 60) return `em ${n} dias`;
  const months = Math.round(n / 30);
  return `em ${months} meses`;
}

// nível de urgência: late | soon | near | ok
function urgency(iso, done = false) {
  if (done) return 'done';
  const n = daysUntil(iso);
  if (n === null) return 'ok';
  if (n < 0) return 'late';
  if (n <= 7) return 'soon';
  if (n <= 30) return 'near';
  return 'ok';
}

function badge(iso, done = false) {
  const u = urgency(iso, done);
  const label = done ? 'concluído' : relDays(iso);
  return `<span class="badge badge-${u}">${esc(label)}</span>`;
}

    if (e.target === wrap || e.target.closest('[data-close]')) closeModal();
  });
  wrap.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const out = {};
    let ok = true;
    fields.forEach((f) => {
      const el = form.elements[f.name];
      let v;
      if (f.type === 'checkbox') v = el.checked;
      else if (f.type === 'number') v = el.value === '' ? '' : Number(el.value);
      else v = el.value.trim();
      if (f.required && (v === '' || v === null)) {
        ok = false;
        el.classList.add('invalid');
      } else el.classList.remove('invalid');
      out[f.name] = v;
    });
    if (!ok) {
      form.querySelector('.invalid')?.focus();
      return;
    }
    onSubmit(out);
    closeModal();
  });
}

function field(f, value) {
  const id = `f-${f.name}`;
  const v = value ?? f.default ?? '';
  const req = f.required ? 'required' : '';
  const ph = f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '';
  let input;
  if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${f.name}" rows="${f.rows || 4}" ${ph} ${req}>${esc(v)}</textarea>`;
  } else if (f.type === 'select') {
    input = `<select id="${id}" name="${f.name}" ${req}>${f.options
      .map(([ov, ol]) => `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`)
      .join('')}</select>`;
  } else if (f.type === 'checkbox') {
    return `<label class="check ${f.full ? 'full' : ''}"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}/> <span>${esc(f.label)}</span></label>`;
  } else {
    input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${ph} ${req} ${
      f.type === 'number' ? 'step="any" min="0"' : ''
    }/>`;
  }
  return `<label class="field ${f.full || f.type === 'textarea' ? 'full' : ''}" for="${id}">
    <span>${esc(f.label)}${f.required ? ' <em>*</em>' : ''}</span>${input}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}
  </label>`;
}

function closeModal() {
  document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
  document.body.classList.remove('no-scroll');
}

function confirmDialog(text, onYes, yesLabel = 'Excluir') {
  closeModal();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal modal-sm" role="alertdialog" aria-modal="true">
    <p class="confirm-text">${esc(text)}</p>
    <footer class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn ${yesLabel === 'Excluir' || yesLabel === 'Apagar' ? 'btn-danger' : 'btn-primary'}" data-yes>${esc(yesLabel)}</button>
    </footer></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('[data-yes]').focus();
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap || e.target.closest('[data-close]')) closeModal();
    if (e.target.closest('[data-yes]')) {
      onYes();
      closeModal();
    }
  });
  wrap.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());
}

return { esc, todayISO, daysUntil, fmtDate, relDays, urgency, badge, icon, emptyState, rowActions, progressBar, toast, openForm, closeModal, confirmDialog };
})();

const __m_metrics = (() => {
// Cálculos derivados: progresso, ritmo, créditos e agenda unificada.
const { store } = __m_store;
const { daysUntil, todayISO } = __m_ui;
const { STAGES, kindLabel } = __m_schemas;

const STATUS_WEIGHT = { todo: 0, doing: 0.5, done: 1 };

function stagesOf(exp) {
  const st = exp.stages || {};
  return STAGES.map((name) => ({ name, status: st[name] || 'todo' }));
}

function experimentProgress(exp) {
  const s = stagesOf(exp);
  return (s.reduce((a, x) => a + STATUS_WEIGHT[x.status], 0) / s.length) * 100;
}

function currentStage(exp) {
  const s = stagesOf(exp);
  return s.find((x) => x.status === 'doing') || s.find((x) => x.status === 'todo') || null;
}

function researchProgress() {
  const exps = store.list('experiments');
  const ms = store.list('milestones').filter((m) => m.kind === 'marco');
  const parts = [];
  if (exps.length) parts.push(exps.reduce((a, e) => a + experimentProgress(e), 0) / exps.length);
  if (ms.length) parts.push((ms.filter((m) => m.done).length / ms.length) * 100);
  if (!parts.length) return 0;
  return parts.reduce((a, b) => a + b, 0) / parts.length;
}

function timeElapsed(profile) {
  if (!profile?.start || !profile?.end) return 0;
  const total = daysUntil(profile.end) - daysUntil(profile.start);
  if (total <= 0) return 0;
  const passed = -daysUntil(profile.start);
  return Math.max(0, Math.min(100, (passed / total) * 100));
}

// Compara tempo decorrido com progresso da pesquisa.
function pace(profile) {
  const t = timeElapsed(profile);
  const p = researchProgress();
  const diff = p - t;
  if (!store.list('experiments').length && !store.list('milestones').length)
    return { t, p, tone: 'neutral', text: 'Cadastre experimentos e marcos para medir seu ritmo.' };
  if (diff >= 5) return { t, p, tone: 'good', text: 'Você está adiantado em relação ao tempo do curso.' };
  if (diff >= -10) return { t, p, tone: 'good', text: 'Você está no ritmo. Siga assim.' };
  if (diff >= -25) return { t, p, tone: 'warn', text: 'Um pouco atrás do tempo. Vale revisar o cronograma com seu orientador.' };
  return { t, p, tone: 'bad', text: 'Bem atrás do tempo do curso. Leve isso para a próxima reunião.' };
}

// Créditos separados por tipo. Disciplina sem tipo conta como obrigatória.
const courseType = (c) => (c.type === 'optativa' ? 'optativa' : 'obrigatoria');

function credits(profile) {
  const sum = (type, status) =>
    store
      .list('courses')
      .filter((c) => (!type || courseType(c) === type) && c.status === status)
      .reduce((a, c) => a + (Number(c.credits) || 0), 0);
  const part = (type, req) => {
    const done = sum(type, 'concluida');
    const ongoing = sum(type, 'cursando');
    req = Number(req) || 0;
    return { done, ongoing, req, pct: req ? (done / req) * 100 : 0, missing: Math.max(0, req - done) };
  };
  const mand = part('obrigatoria', profile?.requiredMandatory);
  const elec = part('optativa', profile?.requiredElective);
  // compatibilidade com a versão antiga, que tinha só "créditos exigidos"
  const totalReq = mand.req + elec.req || Number(profile?.requiredCredits) || 0;
  const total = part(null, totalReq);
  // no total, o que passa do exigido em um tipo não cobre o outro
  if (mand.req || elec.req) {
    const counted = Math.min(mand.done, mand.req) + Math.min(elec.done, elec.req);
    total.pct = totalReq ? (counted / totalReq) * 100 : 0;
    total.missing = mand.missing + elec.missing;
  }
  return { mand, elec, total, split: !!(mand.req || elec.req) };
}

// Agenda unificada: tudo que tem data e ainda não foi resolvido.
function agenda({ includeDone = false } = {}) {
  const out = [];
  const exps = Object.fromEntries(store.list('experiments').map((e) => [e.id, e]));
  store.list('tasks').forEach((t) => {
    if (t.due && (includeDone || !t.done))
      out.push({ date: t.due, title: t.title, kind: 'Tarefa', col: 'tasks', id: t.id, done: !!t.done, sub: exps[t.experimentId]?.title || t.origin || '' });
  });
  const courses = Object.fromEntries(store.list('courses').map((c) => [c.id, c]));
  store.list('assessments').forEach((a) => {
    if (a.date && (includeDone || !a.done))
      out.push({ date: a.date, title: `${kindLabel(a.kind)}: ${a.title}`, kind: 'Disciplina', col: 'assessments', id: a.id, done: !!a.done, sub: courses[a.courseId]?.name || '' });
  });
  store.list('milestones').forEach((m) => {
    if (includeDone || !m.done)
      out.push({ date: m.date, title: m.title, kind: 'Prazo', col: 'milestones', id: m.id, done: !!m.done, sub: m.notes || '' });
  });
  store.list('ethics').forEach((e) => {
    if (e.validUntil)
      out.push({ date: e.validUntil, title: `Validade ${e.kind} ${e.number}`, kind: 'Ética', col: 'ethics', id: e.id, done: false, sub: e.title || '' });
  });
  store.list('congresses').forEach((c) => {
    if (c.abstractDeadline && daysUntil(c.abstractDeadline) >= -1)
      out.push({ date: c.abstractDeadline, title: `Resumo: ${c.event}`, kind: 'Congresso', col: 'congresses', id: c.id, done: false, sub: c.work || '' });
  });
  store.list('experiments').forEach((e) => {
    if (e.deadline && experimentProgress(e) < 100)
      out.push({ date: e.deadline, title: `Concluir: ${e.title}`, kind: 'Experimento', col: 'experiments', id: e.id, done: false, sub: '' });
  });
  const p = store.get().profile;
  if (p?.scholarshipEnd)
    out.push({ date: p.scholarshipEnd, title: `Fim da bolsa ${p.scholarship || ''}`.trim(), kind: 'Bolsa', col: null, id: null, done: false, sub: '' });
  if (p?.end) out.push({ date: p.end, title: 'Previsão de defesa', kind: 'Marco', col: null, id: null, done: false, sub: '' });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function nextMeeting() {
  const t = todayISO();
  return store
    .list('meetings')
    .filter((m) => m.date >= t)
    .sort((a, b) => a.date.localeCompare(b.date))[0];
}

function lastMeeting() {
  const t = todayISO();
  return store
    .list('meetings')
    .filter((m) => m.date < t)
    .sort((a, b) => b.date.localeCompare(a.date))[0];
}

// Resumo de uma disciplina: atividades, média ponderada e próxima entrega.
function courseStats(courseId) {
  const list = store.list('assessments').filter((a) => a.courseId === courseId);
  const graded = list.filter((a) => a.grade !== '' && a.grade !== undefined && a.grade !== null && !isNaN(Number(a.grade)));
  let avg = null;
  if (graded.length) {
    const wsum = graded.reduce((s, a) => s + (Number(a.weight) || 0), 0);
    avg = wsum
      ? graded.reduce((s, a) => s + Number(a.grade) * (Number(a.weight) || 0), 0) / wsum
      : graded.reduce((s, a) => s + Number(a.grade), 0) / graded.length;
  }
  const t = todayISO();
  const next = list
    .filter((a) => !a.done && a.date && a.date >= t)
    .sort((a, b) => a.date.localeCompare(b.date))[0];
  const late = list.filter((a) => !a.done && a.date && a.date < t).length;
  return { list, total: list.length, done: list.filter((a) => a.done).length, graded: graded.length, avg, next, late };
}

return { stagesOf, experimentProgress, currentStage, researchProgress, timeElapsed, pace, courseType, credits, agenda, nextMeeting, lastMeeting, courseStats };
})();

function defaults(type) {

// ---------- Desenho das formas (usado no editor, nas miniaturas e na exportação) ----------
const dashArray = (s) => (s.dash === 'dash' ? `${s.sw * 4} ${s.sw * 3}` : s.dash === 'dot' ? `${s.sw} ${s.sw * 2}` : '');

function wrap(text, w, fs) {
  const max = Math.max(1, Math.floor((w - 16) / (fs * 0.55)));
  const out = [];
  String(text || '').split('\n').forEach((para) => {
    let line = '';
    para.split(/\s+/).forEach((word) => {
      if (!word) return;
      const tryLine = line ? line + ' ' + word : word;
      if (tryLine.length > max && line) {
        out.push(line);
        line = word;
      } else line = tryLine;
    });
    out.push(line);
  });
  return out;
}

function textMarkup(s, font) {
  if (!s.text) return '';
  const lines = wrap(s.text, Math.abs(s.w), s.fs);
  const lh = s.fs * 1.2;
  const cx = s.x + s.w / 2;
  // no triângulo o texto fica um pouco mais para baixo, onde a forma é larga
  const cy = s.y + s.h / 2 + (s.type === 'triangle' ? s.h * 0.15 : 0);
  const y0 = cy - ((lines.length - 1) * lh) / 2;
  return `<text x="${cx}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-family="${font}" font-size="${s.fs}" font-weight="${s.bold ? 700 : 400}" fill="${s.tc}" style="pointer-events:none">${lines
    .map((l, i) => `<tspan x="${cx}" y="${y0 + i * lh}">${esc(l)}</tspan>`)
    .join('')}</text>`;
}

function arrowHead(s) {
  const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
  const len = 14 + s.sw * 3;
  const spread = 0.45;
  const p1 = [s.x2 - len * Math.cos(ang - spread), s.y2 - len * Math.sin(ang - spread)];
  const p2 = [s.x2 - len * Math.cos(ang + spread), s.y2 - len * Math.sin(ang + spread)];
  return `<path d="M${s.x2} ${s.y2} L${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} Z" fill="${s.stroke}" stroke="${s.stroke}" stroke-width="${Math.max(1, s.sw / 2)}" stroke-linejoin="round"/>`;
}

function shapeMarkup(s, { font = 'Outfit, Arial, sans-serif', hit = false } = {}) {
  const stroke = s.stroke === 'transparent' || !s.sw ? 'none' : s.stroke;
  const fill = s.fill === 'transparent' ? 'none' : s.fill;
  const common = `stroke="${stroke}" stroke-width="${s.sw || 0}" stroke-dasharray="${dashArray(s)}" stroke-linejoin="round"`;
  let body = '';
  if (isLine(s)) {
    // a seta termina antes da ponta, para a linha não aparecer por cima dela
    let { x2, y2 } = s;
    if (s.type === 'arrow') {
      const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
      const back = (14 + s.sw * 3) * 0.7;
      x2 -= back * Math.cos(ang);
      y2 -= back * Math.sin(ang);
    }
    body = `<line x1="${s.x1}" y1="${s.y1}" x2="${x2}" y2="${y2}" stroke="${s.stroke}" stroke-width="${s.sw}" stroke-dasharray="${dashArray(s)}" stroke-linecap="round"/>${
      s.type === 'arrow' ? arrowHead(s) : ''
    }${hit ? `<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="transparent" stroke-width="22" stroke-linecap="round"/>` : ''}`;
  } else {
    const { x, y, w, h } = s;
    const hitFill = hit && fill === 'none' ? 'fill="transparent"' : `fill="${fill}"`;
    if (s.type === 'rect' || s.type === 'text') body = `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${hitFill} ${common}/>`;
    else if (s.type === 'round') body = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) * 0.18}" ${hitFill} ${common}/>`;
    else if (s.type === 'ellipse') body = `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" ${hitFill} ${common}/>`;
    else if (s.type === 'triangle') body = `<polygon points="${x + w / 2},${y} ${x + w},${y + h} ${x},${y + h}" ${hitFill} ${common}/>`;
    else if (s.type === 'diamond') body = `<polygon points="${x + w / 2},${y} ${x + w},${y + h / 2} ${x + w / 2},${y + h} ${x},${y + h / 2}" ${hitFill} ${common}/>`;
    body += textMarkup(s, font);
  }
  return `<g data-id="${s.id}">${body}</g>`;
}

function thumbnail(shapes) {
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="thumb-svg" aria-hidden="true"><rect width="${W}" height="${H}" fill="#fff"/>${(shapes || [])

}

}

function mount(params) {

      store.update(

  function pt(e) {

    const { x, y, w, h } = s;

      nw: [x, y], n: [x + w / 2, y], ne: [x + w, y], e: [x + w, y + h / 2],

        .join('');

    ).join('')}<label class="sw custom" title="Outra cor"><input type="color" data-prop="${prop}" value="${current && current !== 'transparent' ? current : '#000000'}"/></label></div>`;

  function setProp(prop, raw) {

  });
  props.addEventListener('change', (e) => {
    if (e.target.dataset.prop && propSnap !== null && propSnap !== snapshot()) {
      pushHistory(propSnap);
      propSnap = snapshot();
      draw();
    }
    if (e.target.type === 'color') renderProps();
  });
  props.addEventListener('click', (e) => {
    const b = e.target.closest('.sw[data-val]');
    if (!b) return;
    pushHistory();
    setProp(b.dataset.prop, b.dataset.val);
    renderProps();
  });

  // ----- comandos -----
  function addShapes(list, { selectLast = true } = {}) {
    pushHistory();
    S.shapes.push(...list);
    if (selectLast) S.sel = list[list.length - 1].id;
    draw();
    renderProps();
    save();
  }

  function duplicate() {
    const s = find(S.sel);
    if (!s) return;
    const c = { ...JSON.parse(JSON.stringify(s)), id: uid() };
    if (isLine(c)) {
      c.x1 += 30; c.y1 += 30; c.x2 += 30; c.y2 += 30;
    } else {
      c.x += 30; c.y += 30;
    }
    addShapes([c]);
  }

  function removeSel() {
    if (!S.sel) return;
    pushHistory();
    S.shapes = S.shapes.filter((s) => s.id !== S.sel);
    S.sel = null;
    draw();
    renderProps();
    save();
  }

  function undo() {
    if (!S.history.length) return;
    S.future.push(snapshot());
    S.shapes = JSON.parse(S.history.pop());
    if (!find(S.sel)) S.sel = null;
    draw();
    renderProps();
    save();
  }

  function redo() {
    if (!S.future.length) return;
    S.history.push(snapshot());
    S.shapes = JSON.parse(S.future.pop());
    if (!find(S.sel)) S.sel = null;
    draw();
    renderProps();
    save();
  }

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
  }

  const fileBase = () =>
    (document.getElementById('dr-title').value.trim() || 'desenho')
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^\w-]+/g, '-')
      .toLowerCase();

  function exportPNG() {
    const svgStr = exportSVGString(S.shapes);
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = W * 2;
      c.height = H * 2;
      const ctx = c.getContext('2d');
      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      c.toBlob((b) => {
        download(fileBase() + '.png', b);
        toast('PNG baixado');
      }, 'image/png');
    };
    img.onerror = () => toast('Não foi possível gerar o PNG');
    img.src = url;
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tool]');
    if (t) {
      S.tool = t.dataset.tool;
      if (S.tool !== 'select') S.sel = null;
      draw();
      renderProps();
      return;
    }
    const c = e.target.closest('[data-cmd]');
    if (!c) return;
    const cmd = c.dataset.cmd;
    const s = find(S.sel);
    if (cmd === 'undo') undo();
    if (cmd === 'redo') redo();
    if (cmd === 'grid') {
      S.grid = !S.grid;
      draw();
      save();
    }
    if (cmd === 'duplicate') duplicate();
    if (cmd === 'delete') removeSel();
    if (cmd === 'front' && s) {
      pushHistory();
      S.shapes = [...S.shapes.filter((x) => x !== s), s];
      draw();
      save();
    }
    if (cmd === 'back' && s) {
      pushHistory();
      S.shapes = [s, ...S.shapes.filter((x) => x !== s)];
      draw();
      save();
    }
    if (cmd === 'tpl-timeline') addShapes(templateTimeline(), { selectLast: false });
    if (cmd === 'tpl-groups') addShapes(templateGroups(), { selectLast: false });
    if (cmd === 'clear' && S.shapes.length) {
      pushHistory();
      S.shapes = [];
      S.sel = null;
      draw();
      renderProps();
      save();
      toast('Desenho limpo. Ctrl+Z desfaz.');
    }
    if (cmd === 'export-png') exportPNG();
    if (cmd === 'export-svg') {
      download(fileBase() + '.svg', new Blob([exportSVGString(S.shapes)], { type: 'image/svg+xml' }));
      toast('SVG baixado');
    }
    if (cmd === 'delete-drawing') {
      confirmDialog('Excluir este desenho?', () => {
        clearTimeout(S.saveTimer);
        S.saveTimer = null;
        store.remove('drawings', id);
        location.hash = '#/planejamento?aba=experimental';
        toast('Desenho excluído');
      });
    }
  });

  document.getElementById('dr-title').addEventListener('input', save);
  document.getElementById('dr-exp').addEventListener('change', save);

  // ----- mouse / toque -----
  svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const p = pt(e);
    const before = snapshot();
    const handle = e.target.closest('[data-handle]');
    const g = e.target.closest('[data-id]');
    svg.setPointerCapture(e.pointerId);

    if (handle && S.sel) {
      S.drag = { kind: 'resize', h: handle.dataset.handle, start: p, orig: { ...find(S.sel) }, before };
      return;
    }
    if (S.tool === 'select') {
      if (g) {
        // duplo clique detectado aqui, porque redesenhar a forma no 1º clique faz o navegador perder o dblclick
        const now = Date.now();
        if (S.lastDown && S.lastDown.id === g.dataset.id && now - S.lastDown.t < 450) {
          S.lastDown = null;
          // abre o editor só depois de soltar o botão, senão o foco do clique fecha a caixa
          S.pendingEdit = g.dataset.id;
          return;
        }
        S.lastDown = { id: g.dataset.id, t: now };
        select(g.dataset.id);
        S.drag = { kind: 'move', start: p, orig: { ...find(S.sel) }, before };
      } else select(null);
      return;
    }
    // criar forma nova
    const x = snap(p.x);
    const y = snap(p.y);
    const s = { id: uid(), type: S.tool, ...defaults(S.tool) };
    if (isLine(s)) Object.assign(s, { x1: x, y1: y, x2: x, y2: y });
    else Object.assign(s, { x, y, w: 0, h: 0 });
    S.shapes.push(s);
    S.sel = s.id;
    S.drag = { kind: 'create', start: { x, y }, before };
    draw();
  });

  svg.addEventListener('pointermove', (e) => {
    if (!S.drag) return;
    const p = pt(e);
    const s = find(S.sel);
    if (!s) return;
    const D = S.drag;
    const dx = p.x - D.start.x;
    const dy = p.y - D.start.y;
    if (D.kind === 'create') {
      if (isLine(s)) {
        let x2 = snap(p.x);
        let y2 = snap(p.y);
        // Shift deixa a linha reta (horizontal, vertical ou 45°)
        if (e.shiftKey) ({ x2, y2 } = straight(s.x1, s.y1, x2, y2));
        s.x2 = x2;
        s.y2 = y2;
      } else {
        let w = snap(p.x) - D.start.x;
        let h = snap(p.y) - D.start.y;
        if (e.shiftKey) {
          const m = Math.max(Math.abs(w), Math.abs(h));
          w = Math.sign(w || 1) * m;
          h = Math.sign(h || 1) * m;
        }
        s.x = w < 0 ? D.start.x + w : D.start.x;
        s.y = h < 0 ? D.start.y + h : D.start.y;
        s.w = Math.abs(w);
        s.h = Math.abs(h);
      }
    } else if (D.kind === 'move') {
      const o = D.orig;
      if (isLine(s)) {
        const ddx = snap(o.x1 + dx) - o.x1;
        const ddy = snap(o.y1 + dy) - o.y1;
        Object.assign(s, { x1: o.x1 + ddx, y1: o.y1 + ddy, x2: o.x2 + ddx, y2: o.y2 + ddy });
      } else {
        s.x = snap(o.x + dx);
        s.y = snap(o.y + dy);
      }
    } else if (D.kind === 'resize') {
      const o = D.orig;
      if (isLine(s)) {
        let nx = snap(p.x);
        let ny = snap(p.y);
        if (D.h === 'p1') {
          if (e.shiftKey) ({ x2: nx, y2: ny } = straight(s.x2, s.y2, nx, ny));
          s.x1 = nx;
          s.y1 = ny;
        } else {
          if (e.shiftKey) ({ x2: nx, y2: ny } = straight(s.x1, s.y1, nx, ny));
          s.x2 = nx;
          s.y2 = ny;
        }
      } else {
        let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
        if (D.h.includes('w')) x1 = snap(o.x + dx);
        if (D.h.includes('e')) x2 = snap(o.x + o.w + dx);
        if (D.h.includes('n')) y1 = snap(o.y + dy);
        if (D.h.includes('s')) y2 = snap(o.y + o.h + dy);
        s.x = Math.min(x1, x2);
        s.y = Math.min(y1, y2);
        s.w = Math.max(10, Math.abs(x2 - x1));
        s.h = Math.max(10, Math.abs(y2 - y1));
      }
    }
    draw();
  });

  function straight(x1, y1, x2, y2) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const stepA = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
    const len = Math.hypot(x2 - x1, y2 - y1);
    return { x2: Math.round(x1 + len * Math.cos(stepA)), y2: Math.round(y1 + len * Math.sin(stepA)) };
  }

  function endDrag() {
    if (S.pendingEdit) {
      const sid = S.pendingEdit;
      S.pendingEdit = null;
      setTimeout(() => editText(sid), 30);
      return;
    }
    if (!S.drag) return;
    const D = S.drag;
    S.drag = null;
    const s = find(S.sel);
    if (D.kind === 'create' && s) {
      // clique sem arrastar: tamanho padrão
      if (isLine(s) && Math.hypot(s.x2 - s.x1, s.y2 - s.y1) < 8) s.x2 = s.x1 + 200;
      if (!isLine(s) && (s.w < 8 || s.h < 8)) {
        s.w = s.type === 'text' ? 320 : 200;
        s.h = s.type === 'text' ? 70 : 120;
      }
      S.tool = 'select';
      if (s.type === 'text') setTimeout(() => editText(s.id, true), 30);
    }
    if (D.before !== snapshot()) {
      pushHistory(D.before);
      save();
    }
    draw();
    renderProps();
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  // ----- escrever dentro da forma -----
  function editText(sid, selectAll = false) {
    const s = find(sid);
    if (!s || isLine(s)) return;
    const g = layer.querySelector(`[data-id="${sid}"]`);
    if (!g) return;
    const r = g.getBoundingClientRect();
    const wr = document.getElementById('dr-wrap').getBoundingClientRect();
    const scale = svg.getBoundingClientRect().width / W;
    const ta = document.createElement('textarea');
    ta.className = 'inline-text';
    ta.value = s.text || '';
    Object.assign(ta.style, {
      left: `${r.left - wr.left + document.getElementById('dr-wrap').scrollLeft}px`,
      top: `${r.top - wr.top + document.getElementById('dr-wrap').scrollTop}px`,
      width: `${Math.max(120, r.width)}px`,
      height: `${Math.max(48, r.height)}px`,
      fontSize: `${Math.max(12, s.fs * scale)}px`,
      fontWeight: s.bold ? 700 : 400,
      color: s.tc,
    });
    document.getElementById('dr-wrap').appendChild(ta);
    ta.focus();
    if (selectAll) ta.select();
    const before = snapshot();
    let done = false;
    const finish = (keep) => {
      if (done) return;
      done = true;
      if (keep && ta.value !== (s.text || '')) {
        s.text = ta.value;
        pushHistory(before);
        save();
      }
      ta.remove();
      select(sid);
    };
    ta.addEventListener('blur', () => finish(true));
    ta.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') finish(false);
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) finish(true);
    });
  }


  // ----- teclado -----
  function onKey(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag)) return;
    if (document.querySelector('.modal-backdrop')) return;
    const mod = e.ctrlKey || e.metaKey;
    const s = find(S.sel);
    if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) return e.preventDefault(), undo();
    if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) return e.preventDefault(), redo();
    if (mod && e.key.toLowerCase() === 'd') return e.preventDefault(), duplicate();
    if (mod && e.key.toLowerCase() === 'c' && s) return (S.clipboard = JSON.stringify(s));
    if (mod && e.key.toLowerCase() === 'v' && S.clipboard) {
      e.preventDefault();
      const c = { ...JSON.parse(S.clipboard), id: uid() };
      if (isLine(c)) {
        c.x1 += 30; c.y1 += 30; c.x2 += 30; c.y2 += 30;
      } else {
        c.x += 30; c.y += 30;
      }
      S.clipboard = JSON.stringify(c);
      return addShapes([c]);
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && s) return e.preventDefault(), removeSel();
    if (e.key === 'Escape') {
      S.tool = 'select';
      return select(null);
    }
    if (e.key === 'Enter' && s && !isLine(s)) return e.preventDefault(), editText(s.id);
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (arrows[e.key] && s) {
      e.preventDefault();
      const step = e.shiftKey ? 20 : 2;
      const [ax, ay] = arrows[e.key];
      pushHistory();
      if (isLine(s)) {
        s.x1 += ax * step; s.x2 += ax * step; s.y1 += ay * step; s.y2 += ay * step;
      } else {
        s.x += ax * step; s.y += ay * step;
      }
      draw();
      save();
      return;
    }
    if (mod || e.altKey) return;
    const keys = { v: 'select', r: 'rect', o: 'ellipse', l: 'line', a: 'arrow', t: 'text' };
    const k = keys[e.key.toLowerCase()];
    if (k) {
      S.tool = k;
      if (k !== 'select') S.sel = null;
      draw();
      renderProps();
    }
  }
  document.addEventListener('keydown', onKey);

  draw();
  renderProps();

  return () => {
    document.removeEventListener('keydown', onKey);
    // garante que a última alteração fique salva ao sair
    if (S.saveTimer && store.find('drawings', id)) {
      clearTimeout(S.saveTimer);
      store.update('drawings', id, {
        shapes: S.shapes,
        grid: S.grid,
        title: document.getElementById('dr-title')?.value.trim() || 'Desenho sem título',
        experimentId: document.getElementById('dr-exp')?.value || '',
        updatedAt: new Date().toISOString(),
      }, { silent: true });
    }
  };
}

return { W, H, shapeMarkup, thumbnail, templateTimeline, templateGroups, render, mount };
})();
