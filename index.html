// ===== js/lit.js =====
const __m_lit = (() => {
// Busca de literatura: PubMed (E-utilities da NCBI) e SciELO.
// SciELO: busca pelo OpenAlex (filtrando DOIs 10.1590, que são os do SciELO), com o Crossref
// como reserva e como fonte dos dados estruturados (autores, volume, páginas) ao salvar.
// Todas as APIs aceitam chamadas direto do navegador, sem servidor.

const EUTILS = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
const TOOL = '&tool=minhapesquisa';
const CROSSREF = 'https://api.crossref.org/';
const OPENALEX = 'https://api.openalex.org/';
let openalexKey = '';
const setOpenAlexKey = (k) => (openalexKey = String(k || '').trim());
const SEL = 'DOI,title,subtitle,author,container-title,short-container-title,issued,abstract,volume,issue,page,URL,type';

async function get(url, as = 'json') {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  let r;
  try {
    r = await fetch(url, { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'A base demorou demais para responder. Tente de novo.' : 'Sem conexão com a base. Verifique a internet e tente de novo.');
  } finally {
    clearTimeout(timer);
  }
  if (r.status === 404) {
    const err = new Error('Não encontrado');
    err.notFound = true;
    throw err;
  }
  if (r.status === 429) {
    const err = new Error('Muitas buscas seguidas. Espere alguns segundos e tente de novo.');
    err.rateLimited = true;
    throw err;
  }
  if (!r.ok) throw new Error(`A base respondeu com erro (${r.status}). Tente de novo em instantes.`);
  return as === 'json' ? r.json() : r.text();
}

// ---------- limpeza de texto ----------
const decode = (s) => {
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
};
const clean = (s) =>
  decode(String(s || '').replace(/<\/?(jats:)?(p|sec)[^>]*>/g, '\n').replace(/<jats:title>[^<]*<\/jats:title>/g, '').replace(/<[^>]+>/g, ''))
    .replace(/[ \t]+/g, ' ')
    .replace(/\n\s*\n+/g, '\n\n')
    .trim();

const MONTHS_EN = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

// "Shiroma PR" (formato PubMed) -> "Shiroma, PR"
function pmName(name) {
  const parts = String(name).trim().split(/\s+/);
  if (parts.length < 2) return name;
  const last = parts[parts.length - 1];
  if (/^[A-Z]{1,4}$/.test(last)) return `${parts.slice(0, -1).join(' ')}, ${last}`;
  return name;
}

// ---------- PubMed ----------
function fromSummary(s) {
  const aid = (t) => (s.articleids || []).find((a) => a.idtype === t)?.value || '';
  const pd = String(s.pubdate || s.epubdate || '');
  const mon = MONTHS_EN[(pd.split(' ')[1] || '').toLowerCase().slice(0, 3)] || '';
  return {
    source: 'pubmed',
    pmid: String(s.uid),
    doi: aid('doi'),
    pmcid: aid('pmc'),
    title: clean(s.title).replace(/\.$/, ''),
    authors: (s.authors || []).filter((a) => a.authtype === 'Author').map((a) => pmName(a.name)).join('; '),
    journal: s.fulljournalname || s.source || '',
    journalAbbr: s.source || '',
    year: pd.slice(0, 4),
    month: mon,
    volume: s.volume || '',
    issue: s.issue || '',
    pages: s.pages || '',
    abstract: '',
    url: `https://pubmed.ncbi.nlm.nih.gov/${s.uid}/`,
  };
}

async function pubmedSummaries(ids) {
  if (!ids.length) return [];
  const r = await get(`${EUTILS}esummary.fcgi?db=pubmed&retmode=json&id=${ids.join(',')}${TOOL}`);
  return ids.map((id) => r.result?.[id]).filter((x) => x && !x.error).map(fromSummary);
}

async function pubmedSearch(q, { start = 0, rows = 20, sort = 'relevance', from = '' } = {}) {
  let url = `${EUTILS}esearch.fcgi?db=pubmed&retmode=json&retmax=${rows}&retstart=${start}&sort=${sort === 'recent' ? 'pub_date' : 'relevance'}&term=${encodeURIComponent(q)}${TOOL}`;
  if (from) url += `&datetype=pdat&mindate=${from}&maxdate=3000`;
  const r = await get(url);
  const ids = r.esearchresult?.idlist || [];
  return { total: Number(r.esearchresult?.count || 0), items: await pubmedSummaries(ids) };
}

async function pubmedAbstract(pmid) {
  const xml = await get(`${EUTILS}efetch.fcgi?db=pubmed&retmode=xml&id=${pmid}${TOOL}`, 'text');
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const abstract = [...doc.querySelectorAll('Abstract > AbstractText')]
    .map((a) => (a.getAttribute('Label') ? `${a.getAttribute('Label')}: ` : '') + a.textContent.trim())
    .join('\n\n');
  const keywords = [...doc.querySelectorAll('KeywordList > Keyword')].map((k) => k.textContent.trim()).join(', ');
  return { abstract, keywords };
}

// ---------- SciELO via Crossref ----------
// Título + subtítulo (o Crossref e o OpenAlex às vezes cortam o título no ":")
function joinSubtitle(title, sub) {
  title = String(title || '').replace(/\s+/g, ' ').trim();
  sub = String(sub || '').replace(/\s+/g, ' ').trim();
  if (!sub || title.toLowerCase().includes(sub.toLowerCase())) return title.replace(/\s*:$/, '');
  return `${title.replace(/\s*:$/, '')}: ${sub}`;
}

function fromCrossref(it) {
  const dp = it.issued?.['date-parts']?.[0] || [];
  const doi = it.DOI || '';
  return {
    source: doi.toLowerCase().startsWith('10.1590/') ? 'scielo' : 'crossref',
    pmid: '',
    doi,
    pmcid: '',
    title: joinSubtitle(clean((it.title || [])[0] || ''), clean((it.subtitle || [])[0] || '')),
    authors: (it.author || [])
      .map((a) => (a.family ? `${a.family}${a.given ? ', ' + a.given : ''}` : a.name || ''))
      .filter(Boolean)
      .join('; '),
    journal: clean((it['container-title'] || [])[0] || ''),
    journalAbbr: clean((it['short-container-title'] || [])[0] || ''),
    year: dp[0] ? String(dp[0]) : '',
    month: dp[1] || '',
    volume: it.volume || '',
    issue: it.issue || '',
    pages: it.page || '',
    abstract: clean(it.abstract || ''),
    url: doi ? `https://doi.org/${doi}` : it.URL || '',
  };
}

// ---------- SciELO via OpenAlex ----------
function abstractFromIndex(idx) {
  if (!idx) return '';
  const words = [];
  Object.entries(idx).forEach(([w, pos]) => pos.forEach((p) => (words[p] = w)));
  return words.filter((w) => w !== undefined).join(' ');
}

const PARTICLES = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'del', 'della', 'van', 'von', 'y']);
function splitName(full) {
  const parts = String(full || '').trim().split(/\s+/);
  if (parts.length < 2) return full;
  const family = parts.pop();
  return `${family}, ${parts.filter((p) => !PARTICLES.has(p.toLowerCase())).join(' ')}`;
}

function fromOpenAlex(w) {
  const doi = String(w.doi || '').replace(/^https?:\/\/doi\.org\//i, '');
  const b = w.biblio || {};
  const date = String(w.publication_date || '');
  return {
    source: 'scielo',
    pmid: String(w.ids?.pmid || '').replace(/\D/g, ''),
    doi,
    pmcid: '',
    title: clean(w.title || w.display_name || ''),
    authors: (w.authorships || []).map((a) => splitName(a.author?.display_name)).filter(Boolean).join('; '),
    journal: w.primary_location?.source?.display_name || '',
    journalAbbr: '',
    year: w.publication_year ? String(w.publication_year) : '',
    month: date.length >= 7 ? Number(date.slice(5, 7)) : '',
    volume: b.volume || '',
    issue: b.issue || '',
    pages: b.first_page ? `${b.first_page}${b.last_page && b.last_page !== b.first_page ? '-' + b.last_page : ''}` : '',
    abstract: abstractFromIndex(w.abstract_inverted_index),
    url: doi ? `https://doi.org/${doi}` : '',
  };
}

async function scieloOpenAlex(q, { start = 0, rows = 20, sort = 'relevance', from = '' } = {}) {
  const filter = ['doi_starts_with:10.1590', 'type:article', from ? `from_publication_date:${from}-01-01` : ''].filter(Boolean).join(',');
  const page = Math.floor(start / rows) + 1;
  const sel = 'id,ids,doi,title,display_name,publication_year,publication_date,authorships,primary_location,biblio,abstract_inverted_index';
  const url = `${OPENALEX}works?search=${encodeURIComponent(q)}&filter=${filter}&per_page=${rows}&page=${page}&select=${sel}${
    sort === 'recent' ? '&sort=publication_date:desc' : ''
  }${openalexKey ? '&api_key=' + encodeURIComponent(openalexKey) : ''}`;
  const r = await get(url);
  return { total: Number(r.meta?.count || 0), items: (r.results || []).map(fromOpenAlex) };
}

// Busca no SciELO: OpenAlex primeiro; se a cota diária acabar ou ele falhar, usa o Crossref.
async function scieloSearch(q, opts = {}) {
  try {
    return await scieloOpenAlex(q, opts);
  } catch (e) {
    const r = await scieloCrossref(q, opts);
    r.fallback = true;
    return r;
  }
}

// Reserva: Crossref tende a misturar resultados que têm só uma das palavras,
// então reordenamos pelos que contêm mais termos da busca.
const normTxt = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function rerank(items, q) {
  const terms = normTxt(q)
    .split(/[^a-z0-9]+/)
    .filter((t) => t.length > 2 && !PARTICLES.has(t))
    .map((t) => (t.length > 5 ? t.slice(0, -2) : t));
  if (!terms.length) return items;
  return items
    .map((a, i) => {
      const hay = normTxt(a.title + ' ' + a.abstract);
      return { a, i, s: terms.filter((t) => hay.includes(t)).length };
    })
    .sort((x, y) => y.s - x.s || x.i - y.i)
    .map((x) => x.a);
}

async function scieloCrossref(q, { start = 0, rows = 20, sort = 'relevance', from = '' } = {}) {
  const filter = ['type:journal-article', from ? `from-pub-date:${from}` : ''].filter(Boolean).join(',');
  const url = `${CROSSREF}prefixes/10.1590/works?query=${encodeURIComponent(q)}&rows=${rows}&offset=${start}&filter=${filter}&select=${SEL}${
    sort === 'recent' ? '&sort=published&order=desc' : ''
  }`;
  const r = await get(url);
  const items = (r.message?.items || []).map(fromCrossref);
  return { total: Number(r.message?.['total-results'] || 0), items: sort === 'recent' ? items : rerank(items, q) };
}

// Ao salvar um artigo do SciELO, completa com os dados estruturados do Crossref
async function enrichFromCrossref(a) {
  if (!a.doi) return a;
  try {
    const c = await crossrefByDoi(a.doi);
    return {
      ...a,
      authors: c.authors || a.authors,
      journal: c.journal || a.journal,
      journalAbbr: c.journalAbbr || a.journalAbbr,
      year: c.year || a.year,
      month: c.month || a.month,
      volume: c.volume || a.volume,
      issue: c.issue || a.issue,
      pages: c.pages || a.pages,
      title: c.title && c.title.length > (a.title || '').length ? c.title : (a.title || '').replace(/\s*:$/, ''),
      abstract: a.abstract || c.abstract,
    };
  } catch (e) {
    return a;
  }
}

async function crossrefByDoi(doi) {
  const r = await get(`${CROSSREF}works/${encodeURIComponent(doi)}`);
  return fromCrossref(r.message);
}

// ---------- Identificar o que a pessoa colou ----------
function parseIdentifier(input) {
  const s = String(input || '').trim();
  if (!s) return null;
  const pm = s.match(/pubmed\.ncbi\.nlm\.nih\.gov\/(\d{1,9})/i) || s.match(/^(?:pmid:?\s*)?(\d{1,9})$/i);
  if (pm) return { type: 'pmid', value: pm[1] };
  const doi = s.match(/10\.\d{4,9}\/[^\s"<>]+/i);
  if (doi) return { type: 'doi', value: decodeURIComponent(doi[0]).replace(/[.,;)\]]+$/, '') };
  // link do SciELO com pid: o DOI do SciELO costuma ser derivado do pid, mas não é garantido
  return null;
}

async function lookup(input) {
  const id = parseIdentifier(input);
  if (!id) throw new Error('Cole um DOI (10.xxxx/...), um PMID (só números) ou o link do artigo no PubMed ou com DOI.');
  if (id.type === 'pmid') {
    const [art] = await pubmedSummaries([id.value]);
    if (!art) throw new Error(`Não achei o PMID ${id.value} no PubMed.`);
    Object.assign(art, await pubmedAbstract(id.value).catch(() => ({})));
    return art;
  }
  // DOI: primeiro tenta o PubMed (traz resumo e PMID); se não estiver lá, usa o Crossref (SciELO e outras)
  try {
    const r = await get(`${EUTILS}esearch.fcgi?db=pubmed&retmode=json&term=${encodeURIComponent(id.value + '[doi]')}${TOOL}`);
    const pmid = r.esearchresult?.idlist?.[0];
    if (pmid) {
      const [art] = await pubmedSummaries([pmid]);
      if (art) {
        Object.assign(art, await pubmedAbstract(pmid).catch(() => ({})));
        if (id.value.toLowerCase().startsWith('10.1590/')) art.source = 'scielo';
        return art;
      }
    }
  } catch (e) {
    /* segue para o Crossref */
  }
  try {
    return await crossrefByDoi(id.value);
  } catch (e) {
    if (e.notFound) throw new Error(`Não achei o DOI ${id.value}. Confira se ele está completo.`);
    throw e;
  }
}

// ---------- Referências ----------
function parseAuthors(text) {
  return String(text || '')
    .split(';')
    .map((a) => a.trim())
    .filter(Boolean)
    .map((a) => {
      const [family, given = ''] = a.split(',').map((x) => x.trim());
      return { family, given };
    });
}

function initials(given) {
  const out = [];
  String(given || '')
    .split(/[\s.\-]+/)
    .filter((t) => t && !PARTICLES.has(t.toLowerCase())) // "da", "de", "dos" não viram iniciais
    .forEach((t) => {
      if (/^[A-ZÀ-Ý]{1,4}$/.test(t) && t.length <= 3) out.push(...t.split(''));
      else out.push(t[0].toUpperCase());
    });
  return out;
}

const MONTHS_ABNT = ['jan.', 'fev.', 'mar.', 'abr.', 'maio', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
const endDot = (s) => (/[.?!]$/.test(s) ? s : s + '.');

// ABNT NBR 6023:2018 (artigo de periódico). Até 3 autores: todos; mais de 3: primeiro + et al.
function abnt(a, { html = false } = {}) {
  const au = parseAuthors(a.authors);
  const fmt = (x) => {
    const ini = initials(x.given);
    return `${x.family.toUpperCase()}${ini.length ? ', ' + ini.map((i) => i + '.').join(' ') : ''}`;
  };
  let authors = au.length > 3 ? `${fmt(au[0])} et al.` : au.map(fmt).join('; ');
  const journal = html ? `<b>${escHtml(a.journal)}</b>` : a.journal;
  const parts = [];
  if (a.volume) parts.push(`v. ${a.volume}`);
  if (a.issue) parts.push(`n. ${a.issue}`);
  if (a.pages) parts.push(`p. ${a.pages}`);
  const date = [a.month ? MONTHS_ABNT[Number(a.month) - 1] : '', a.year].filter(Boolean).join(' ');
  if (date) parts.push(date);
  let ref = `${authors ? endDot(authors) + ' ' : ''}${endDot(html ? escHtml(a.title) : a.title)} ${journal}${parts.length ? ', ' + parts.join(', ') : ''}.`;
  if (a.doi) ref += ` DOI: https://doi.org/${a.doi}.`;
  else if (a.url) ref += ` Disponível em: ${a.url}.`;
  return ref;
}

// Vancouver (ICMJE/NLM). Até 6 autores; mais de 6: os 6 primeiros + et al.
function vancouver(a) {
  const au = parseAuthors(a.authors);
  const fmt = (x) => `${x.family} ${initials(x.given).join('')}`.trim();
  let authors = au.slice(0, 6).map(fmt).join(', ');
  if (au.length > 6) authors += ', et al';
  const journal = String(a.journalAbbr || a.journal || '').replace(/\.+$/, '');
  let src = `${journal}. ${a.year || ''}`;
  if (a.volume) src += `;${a.volume}`;
  if (a.issue) src += `(${a.issue})`;
  if (a.pages) src += `:${a.pages}`;
  let ref = `${authors ? authors + '. ' : ''}${endDot(a.title)} ${src}.`;
  if (a.doi) ref += ` doi:${a.doi}`;
  return ref;
}

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function shortAuthors(text, n = 3) {
  const au = parseAuthors(text);
  if (!au.length) return '';
  const names = au.slice(0, n).map((x) => `${x.family}${x.given ? ' ' + initials(x.given).join('') : ''}`);
  return names.join(', ') + (au.length > n ? ' et al.' : '');
}

const articleKey = (a) => (a.pmid ? 'pmid:' + a.pmid : a.doi ? 'doi:' + a.doi.toLowerCase() : 't:' + (a.title || '').toLowerCase());

return { setOpenAlexKey, clean, pubmedSummaries, pubmedSearch, pubmedAbstract, scieloSearch, enrichFromCrossref, crossrefByDoi, parseIdentifier, lookup, parseAuthors, abnt, vancouver, shortAuthors, articleKey };
})();

// ===== js/cloud.js =====
const __m_cloud = (() => {
// Login e sincronização com o Supabase.
// Modelo: um documento JSON por pessoa (tabela user_data). O navegador guarda uma cópia
// local (funciona sem internet) e envia as mudanças para a nuvem alguns segundos depois.
// Controle de versão pelo updated_at: se outro aparelho salvou antes, avisamos em vez de
// sobrescrever.
const { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JS } = __m_config;
const { store } = __m_store;

const META_KEY = 'minhapesquisa:sync';
const LOCAL_ONLY_KEY = 'minhapesquisa:local-only';
const PUSH_DELAY = 1500;

const cloudEnabled = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

let sb = null;
let readyForUser = null; // id do usuário cuja sincronização inicial já foi feita
let pushTimer = null;
let retryTimer = null;
let remoteExists = false;
const listeners = new Set();

const cloud = {
  ready: !cloudEnabled, // vira true quando a sessão foi verificada
  user: null,
  status: 'off', // off | syncing | pending | saving | synced | offline | error | conflict
  error: '',
  conflict: null, // { remote: {data, updated_at}, firstLogin }
  recovery: false, // chegou pelo link de "esqueci a senha"
};

const onCloudChange = (fn) => {
  listeners.add(fn);
  return () => listeners.delete(fn);
};
const emit = () => listeners.forEach((fn) => fn(cloud));

function meta() {
  try {
    return JSON.parse(localStorage.getItem(META_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function setMeta(m) {
  if (cloud.user?.email && m.userId === cloud.user.id) m = { ...m, email: cloud.user.email };
  try {
    localStorage.setItem(META_KEY, JSON.stringify(m));
  } catch (e) {
    /* sem armazenamento local */
  }
}
const sameTime = (a, b) => !!a && !!b && Date.parse(a) === Date.parse(b);

const isLocalOnly = () => {
  try {
    return localStorage.getItem(LOCAL_ONLY_KEY) === '1';
  } catch (e) {
    return false;
  }
};
function setLocalOnly(v) {
  try {
    if (v) localStorage.setItem(LOCAL_ONLY_KEY, '1');
    else localStorage.removeItem(LOCAL_ONLY_KEY);
  } catch (e) {
    /* ok */
  }
  emit();
}

let importAttempt = 0;
async function client() {
  if (sb) return sb;
  // o navegador guarda o erro de um import que falhou: em nova tentativa, muda o endereço
  const url = importAttempt++ ? `${SUPABASE_JS}?tentativa=${importAttempt}` : SUPABASE_JS;
  const mod = await import(url);
  sb = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  return sb;
}

// Executa uma consulta e nunca lança: falha de rede vira { error }
async function q(promiseLike) {
  try {
    const r = await promiseLike;
    return r || { data: null, error: { message: 'sem resposta' } };
  } catch (e) {
    return { data: null, error: { message: e?.message || 'Failed to fetch', network: true } };
  }
}
const isNetwork = (err) => !navigator.onLine || err?.network || /fetch|network|load failed/i.test(err?.message || '');
const OFFLINE_MSG = 'Sem internet. As alterações ficam salvas neste aparelho e sobem quando a conexão voltar.';

function setStatus(status, error = '') {
  cloud.status = status;
  cloud.error = error;
  emit();
}

// ---------- Inicialização ----------
let listenersOn = false;
async function initCloud() {
  if (!cloudEnabled) return;
  try {
    await client();
  } catch (e) {
    // Sem internet ao abrir. Se a pessoa já estava conectada, abre normalmente com a cópia
    // deste aparelho; as alterações ficam pendentes e sobem quando a conexão voltar.
    const m = meta();
    if (m.userId) {
      cloud.user = { id: m.userId, email: m.email || '', offline: true };
      readyForUser = m.userId;
    }
    cloud.ready = true;
    setStatus('offline', OFFLINE_MSG);
    const retry = () => {
      window.removeEventListener('online', retry);
      clearInterval(retryInit);
      reconnect();
    };
    const retryInit = setInterval(() => navigator.onLine && retry(), 30000);
    window.addEventListener('online', retry);
    return;
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      cloud.recovery = true;
      emit();
    }
    const u = session?.user || null;
    if (u?.id !== cloud.user?.id) {
      cloud.user = u;
      if (u) setTimeout(() => afterLogin(), 0);
      else {
        readyForUser = null;
        setStatus('off');
      }
    }
  });
  try {
    const { data } = await sb.auth.getSession();
    cloud.user = data.session?.user || null;
  } catch (e) {
    cloud.user = null;
  }
  // remove o ?code= que volta do link de e-mail
  if (/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  cloud.ready = true;
  if (cloud.user) await afterLogin();
  else emit();

  if (listenersOn) return;
  listenersOn = true;
  window.addEventListener('focus', () => pull());
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && pull());
  window.addEventListener('online', () => {
    if (meta().dirty) schedulePush(0);
    else pull();
  });
  setInterval(() => pull(), 60000);
}

// Conexão voltou depois de abrir sem internet: carrega o Supabase e sincroniza
async function reconnect() {
  readyForUser = null;
  const offlineUser = cloud.user?.offline ? cloud.user : null;
  try {
    await client();
  } catch (e) {
    readyForUser = offlineUser?.id || null;
    setTimeout(() => initCloud(), 0);
    return;
  }
  if (offlineUser) cloud.user = null; // a sessão real vem do Supabase
  await initCloud();
}

store.onPersist((state, origin) => {
  if (origin === 'cloud' || !cloud.user || readyForUser !== cloud.user.id) return;
  setMeta({ ...meta(), userId: cloud.user.id, dirty: true });
  if (cloud.status === 'conflict') return;
  if (!sb) return setStatus('offline', OFFLINE_MSG);
  cloud.status = 'pending';
  emit();
  schedulePush();
});

function schedulePush(delay = PUSH_DELAY) {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, delay);
}

// ---------- Depois do login ----------
let loginInFlight = null;
async function afterLogin() {
  const user = cloud.user;
  if (!user || readyForUser === user.id || loginInFlight === user.id) return;
  loginInFlight = user.id;
  try {
    await firstSync(user);
  } finally {
    loginInFlight = null;
  }
}

async function firstSync(user) {
  setLocalOnly(false);
  setStatus('syncing');
  const m = meta();
  const { data: row, error } = await q(sb.from('user_data').select('data, updated_at').eq('user_id', user.id).maybeSingle());
  if (error) {
    readyForUser = user.id; // segue funcionando localmente
    setStatus(isNetwork(error) ? 'offline' : 'error', isNetwork(error) ? OFFLINE_MSG : error.message);
    return;
  }
  readyForUser = user.id;
  remoteExists = !!row;
  const localHas = store.hasContent();

  // dados locais são de outra conta: nunca enviar, só trocar pelos da nuvem
  if (m.userId && m.userId !== user.id) {
    if (row) return applyRemote(row);
    store.reset({ origin: 'cloud' });
    setMeta({ userId: user.id, last: null, dirty: false });
    return setStatus('synced');
  }
  if (!row) {
    // primeira vez desta conta: o que já existe neste navegador vai para a nuvem
    if (localHas) return push();
    setMeta({ userId: user.id, last: null, dirty: false });
    return setStatus('synced');
  }
  if (!localHas) return applyRemote(row);
  if (m.userId === user.id) {
    if (!m.dirty) return applyRemote(row);
    if (sameTime(row.updated_at, m.last)) return push(); // só este aparelho mudou
    cloud.conflict = { remote: row, firstLogin: false };
    return setStatus('conflict');
  }
  // navegador tinha dados sem conta e a conta já tem dados na nuvem
  if (JSON.stringify(row.data) === JSON.stringify(store.get())) return applyRemote(row);
  cloud.conflict = { remote: row, firstLogin: true };
  setStatus('conflict');
}

function applyRemote(row) {
  store.replaceAll(row.data || {}, { origin: 'cloud' });
  setMeta({ userId: cloud.user.id, last: row.updated_at, dirty: false });
  cloud.conflict = null;
  setStatus('synced');
}

// ---------- Enviar ----------
async function push() {
  clearTimeout(pushTimer);
  clearTimeout(retryTimer);
  const user = cloud.user;
  if (!user || !sb || cloud.status === 'conflict') return;
  const m = meta();
  const now = new Date().toISOString();
  const data = store.get();
  setStatus('saving');
  let res;
  if (!remoteExists) {
    res = await q(sb.from('user_data').insert({ user_id: user.id, data, updated_at: now }).select('updated_at'));
    if (res.error?.code === '23505') {
      // outro aparelho criou antes
      remoteExists = true;
      return checkConflict();
    }
  } else {
    let upd = sb.from('user_data').update({ data, updated_at: now }).eq('user_id', user.id);
    if (m.last) upd = upd.eq('updated_at', m.last);
    res = await q(upd.select('updated_at'));
    if (!res.error && res.data && res.data.length === 0) return checkConflict();
  }
  if (res.error) {
    const offline = isNetwork(res.error);
    setStatus(offline ? 'offline' : 'error', offline ? OFFLINE_MSG : res.error.message);
    retryTimer = setTimeout(push, 20000);
    return;
  }
  remoteExists = true;
  const saved = res.data?.[0]?.updated_at || now;
  // se algo mudou enquanto enviava, manda de novo
  const stillDirty = JSON.stringify(store.get()) !== JSON.stringify(data);
  setMeta({ userId: user.id, last: saved, dirty: stillDirty });
  setStatus(stillDirty ? 'pending' : 'synced');
  if (stillDirty) schedulePush();
}

async function checkConflict() {
  const { data: row, error } = await q(sb.from('user_data').select('data, updated_at').eq('user_id', cloud.user.id).maybeSingle());
  if (error) {
    setStatus(isNetwork(error) ? 'offline' : 'error', isNetwork(error) ? OFFLINE_MSG : error.message);
    retryTimer = setTimeout(push, 20000);
    return;
  }
  if (!row) {
    remoteExists = false;
    return push();
  }
  cloud.conflict = { remote: row, firstLogin: false };
  setStatus('conflict');
}

// ---------- Buscar mudanças de outros aparelhos ----------
async function pull() {
  const user = cloud.user;
  if (!user || !sb || readyForUser !== user.id) return;
  if (['saving', 'conflict', 'syncing'].includes(cloud.status)) return;
  const m = meta();
  const { data: row, error } = await q(sb.from('user_data').select('updated_at').eq('user_id', user.id).maybeSingle());
  if (error || !row) return;
  if (sameTime(row.updated_at, m.last)) {
    if (cloud.status === 'offline' || cloud.status === 'error') setStatus(m.dirty ? 'pending' : 'synced');
    if (m.dirty) schedulePush(0);
    return;
  }
  const full = await q(sb.from('user_data').select('data, updated_at').eq('user_id', user.id).maybeSingle());
  if (full.error || !full.data) return;
  if (m.dirty) {
    cloud.conflict = { remote: full.data, firstLogin: false };
    return setStatus('conflict');
  }
  applyRemote(full.data);
}

async function syncNow() {
  if (meta().dirty) return push();
  return pull();
}

// choice: 'cloud' (usar o que está na nuvem) | 'local' (usar o deste aparelho)
async function resolveConflict(choice) {
  const c = cloud.conflict;
  if (!c) return;
  if (choice === 'cloud') return applyRemote(c.remote);
  remoteExists = true;
  setMeta({ userId: cloud.user.id, last: c.remote.updated_at, dirty: true });
  cloud.conflict = null;
  cloud.status = 'pending';
  return push();
}

// ---------- Conta ----------
const MSG = {
  'Invalid login credentials': 'E-mail ou senha incorretos.',
  'Email not confirmed': 'Seu e-mail ainda não foi confirmado. Procure a mensagem de confirmação na sua caixa de entrada.',
  'User already registered': 'Já existe uma conta com este e-mail. Use "Entrar".',
  'Password should be at least 6 characters.': 'A senha precisa ter pelo menos 6 caracteres.',
};
const friendly = (e) => {
  const m = e?.message || String(e);
  if (MSG[m]) return MSG[m];
  if (/rate limit|429/i.test(m)) return 'Muitas tentativas em pouco tempo. Espere alguns minutos e tente de novo.';
  if (/fetch|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  if (/weak|pwned/i.test(m)) return 'Essa senha é fraca ou já apareceu em vazamentos. Escolha outra.';
  return m;
};

async function signIn(email, password) {
  await client();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw new Error(friendly(error));
}

async function signUp(email, password) {
  await client();
  const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) throw new Error(friendly(error));
  // com "Confirm email" ligado, não vem sessão: a pessoa precisa confirmar pelo e-mail
  return { needsConfirmation: !data.session };
}

async function sendReset(email) {
  await client();
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) throw new Error(friendly(error));
}

async function setNewPassword(password) {
  const { error } = await sb.auth.updateUser({ password });
  if (error) throw new Error(friendly(error));
  cloud.recovery = false;
  emit();
}

async function signOut({ keepLocal = false } = {}) {
  if (meta().dirty && cloud.status !== 'conflict') {
    try {
      await push();
    } catch (e) {
      /* tenta, mas não bloqueia a saída */
    }
  }
  try {
    await sb?.auth.signOut();
  } catch (e) {
    /* ok */
  }
  readyForUser = null;
  cloud.user = null;
  cloud.conflict = null;
  remoteExists = false;
  if (!keepLocal) {
    store.reset({ origin: 'cloud' });
    setMeta({});
  }
  setStatus('off');
}

const pendingChanges = () => !!meta().dirty;

return { cloudEnabled, cloud, onCloudChange, isLocalOnly, setLocalOnly, initCloud, pull, syncNow, resolveConflict, signIn, signUp, sendReset, setNewPassword, signOut, pendingChanges };
})();

        <small class="muted">${[c.term, c.credits ? `${c.credits} créditos` : '', c.professor].filter(Boolean).map(esc).join(' · ')}</small></div>
      <span class="pill type-${type}">${type === 'optativa' ? 'Optativa' : 'Obrigatória'}</span>
    </div>
    ${c.schedule ? `<p class="small muted">${icon('clock')} ${esc(c.schedule)}${c.room ? ' · ' + esc(c.room) : ''}</p>` : ''}
    <div class="course-stats">
      <div><span>Atividades</span><b>${st.done}/${st.total}</b></div>
      <div><span>Média parcial</span><b>${fmtGrade(st.avg)}</b></div>
      <div class="grow"><span>Próxima</span>${
        st.next ? `<b class="ellipsis">${esc(kindLabel(st.next.kind))}: ${esc(st.next.title)}</b> ${badge(st.next.date)}` : `<b class="muted">${st.late ? `${st.late} atrasada(s)` : '—'}</b>`
      }</div>
    </div>
    ${st.total ? progressBar((st.done / st.total) * 100) : ''}
  </a>`;
}

function renderCourse(params) {
  const c = store.find('courses', params.get('disc'));
  if (!c)
    return `<div class="empty"><p>Disciplina não encontrada.</p><a class="btn btn-soft" href="#/planejamento?aba=academico">Voltar</a></div>`;
  const st = courseStats(c.id);
  const filter = params.get('tipo') || '';
  const type = courseType(c);
  const counts = Object.fromEntries(ASSESSMENT_KINDS.map(([k]) => [k, st.list.filter((a) => (a.kind || 'outro') === k).length]));
  const list = st.list
    .filter((a) => !filter || (a.kind || 'outro') === filter)
    .sort((a, b) => (a.done - b.done) || (a.date || '9999').localeCompare(b.date || '9999'));
  const base = `#/planejamento?aba=academico&disc=${c.id}`;
  const totalWeight = st.list.reduce((s, a) => s + (Number(a.weight) || 0), 0);

  return `<a class="back-link" href="#/planejamento?aba=academico">${icon('arrow', 'flip')} Todas as disciplinas</a>
    <header class="course-head">
      <div>
        <h2 class="course-name">${esc(c.name)}</h2>
        <div class="chips">
          <span class="pill type-${type}">${type === 'optativa' ? 'Optativa' : 'Obrigatória'}</span>
          <span class="pill status-${c.status}">${STATUS[c.status] || ''}</span>
          ${c.credits ? `<span class="pill">${esc(c.credits)} créditos</span>` : ''}
          ${c.term ? `<span class="pill">${esc(c.term)}</span>` : ''}
          ${c.grade ? `<span class="pill">Conceito final: ${esc(c.grade)}</span>` : ''}
        </div>
        <p class="muted course-meta">
          ${c.professor ? `${icon('users')} ${esc(c.professor)}` : ''}
          ${c.schedule ? `${icon('clock')} ${esc(c.schedule)}` : ''}
          ${c.room ? `${icon('home')} ${esc(c.room)}` : ''}
          ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${icon('link')} Ementa</a>` : ''}
        </p>
      </div>
      <div class="head-actions">
        <button class="btn btn-ghost" data-action="edit" data-col="courses" data-id="${c.id}">${icon('edit')} Editar disciplina</button>
      </div>
    </header>

    <div class="stat-row">
      <div class="card stat"><span>Média parcial</span><b>${fmtGrade(st.avg)}</b><small class="muted">${st.graded ? `${st.graded} atividade(s) com nota` : 'Nenhuma nota ainda'}</small></div>
      <div class="card stat"><span>Atividades concluídas</span><b>${st.done}/${st.total}</b>${st.total ? progressBar((st.done / st.total) * 100) : '<small class="muted">Cadastre abaixo</small>'}</div>
      <div class="card stat"><span>Próxima entrega</span>${
        st.next
          ? `<b class="stat-next">${esc(st.next.title)}</b><small>${fmtDate(st.next.date)} ${badge(st.next.date)}</small>`
          : `<b>—</b><small class="muted">${st.late ? `${st.late} atrasada(s)` : 'Nada pendente'}</small>`
      }</div>
      <div class="card stat"><span>Pesos cadastrados</span><b>${totalWeight}%</b><small class="muted">${totalWeight === 100 ? 'Soma completa ✓' : totalWeight > 100 ? 'Passa de 100%' : 'Soma dos pesos das atividades'}</small></div>
    </div>

    <div class="add-row">
      ${ASSESSMENT_KINDS.map(
        ([k, label]) => `<button class="btn btn-soft" data-action="add-assessment" data-course="${c.id}" data-kind="${k}">${icon('plus')} ${k === 'apresentacao' ? 'Apresentação' : k === 'outro' ? 'Outra atividade' : label}</button>`
      ).join('')}
    </div>

    <nav class="tabs" aria-label="Tipos de atividade">
      <a href="${base}" class="tab ${!filter ? 'active' : ''}">Todas <span class="count">${st.total}</span></a>
      ${ASSESSMENT_KINDS.map(
        ([k]) => `<a href="${base}&tipo=${k}" class="tab ${filter === k ? 'active' : ''}">${icon(KIND_ICON[k])} ${PLURAL[k]} <span class="count">${counts[k]}</span></a>`
      ).join('')}
    </nav>

    ${
      list.length
        ? `<ul class="rows">${list
            .map(
              (a) => `<li class="row assess ${a.done ? 'is-done' : ''}">
          <button class="checkbox ${a.done ? 'checked' : ''}" data-action="toggle-done" data-col="assessments" data-id="${a.id}" aria-label="${a.done ? 'Reabrir' : 'Marcar como concluída'}">${a.done ? icon('check') : ''}</button>
          <span class="kind kind-${a.kind || 'outro'}">${icon(KIND_ICON[a.kind || 'outro'])} ${kindLabel(a.kind)}</span>
          <div class="row-main"><strong>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title)}</strong>
            ${a.description ? `<small class="muted pre clamp">${esc(a.description)}</small>` : ''}</div>
          <div class="assess-meta">
            ${a.date ? `<small>${fmtDate(a.date)}</small> ${badge(a.date, a.done)}` : '<small class="muted">sem data</small>'}
          </div>
          <div class="assess-nums"><small>Peso</small><b>${a.weight !== '' && a.weight !== undefined ? esc(a.weight) + '%' : '—'}</b></div>
          <div class="assess-nums"><small>Nota</small><b>${a.grade !== '' && a.grade !== undefined ? fmtGrade(a.grade) : '—'}</b></div>
          ${rowActions('assessments', a.id)}
        </li>`
            )
            .join('')}</ul>`
        : emptyState(
            filter ? `Nenhuma atividade do tipo “${kindLabel(filter)}” nesta disciplina.` : 'Cadastre provas, trabalhos e apresentações. As datas entram em “O que eu faço hoje?” e em Prazos.',
            '',
            ''
          )
    }
    ${linkedArticles(c.id)}`;
}

function linkedArticles(courseId) {
  const list = store.list('articles').filter((a) => a.courseId === courseId);
  if (!list.length) return '';
  return `<section class="section linked-arts">
    <h3 class="sub">${icon('book')} Artigos da biblioteca ligados a esta disciplina</h3>
    <ul class="rows">${list
      .map(
        (a) => `<li class="row"><div class="row-main"><strong>${esc(a.title)}</strong><small class="muted">${esc([a.journal, a.year].filter(Boolean).join(' · '))}</small></div>
        <button class="btn btn-ghost sm" data-action="edit" data-col="articles" data-id="${a.id}">${icon('note')} Fichamento</button></li>`
      )
      .join('')}</ul>
  </section>`;
}

return { renderList, renderCourse };
})();

// ===== js/views/planning.js =====
const __m_views_planning = (() => {
const { store } = __m_store;
const { esc, icon, fmtDate, badge, progressBar, rowActions, emptyState, daysUntil } = __m_ui;
const { stagesOf, experimentProgress } = __m_metrics;
const { STAGE_STATUS } = __m_schemas;
const drawing = __m_views_drawing;
const course = __m_views_course;

const title = 'Planejamento';

function render(params) {
  if (params.get('desenho')) return drawing.render(params);
  const aba = params.get('aba') === 'academico' ? 'academico' : 'experimental';
  return `<div class="page">
    <header class="page-head">
      <div><p class="eyebrow dark">Planejamento</p><h1>${aba === 'academico' ? 'Planejamento acadêmico' : 'Planejamento experimental'}</h1></div>
    </header>
    <nav class="subtabs" aria-label="Tipo de planejamento">
      <a href="#/planejamento?aba=experimental" class="subtab ${aba === 'experimental' ? 'active' : ''}">${icon('flask')} Planejamento experimental</a>
      <a href="#/planejamento?aba=academico" class="subtab ${aba === 'academico' ? 'active' : ''}">${icon('book')} Planejamento acadêmico</a>
    </nav>
    ${aba === 'academico' ? (params.get('disc') ? course.renderCourse(params) : course.renderList()) : experimental(params)}
  </div>`;
}

function mount(params) {
  if (params.get('desenho')) return drawing.mount(params);
  return null;
}

const localISO = (iso) => {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

function drawingsSection(s, expName) {
  const list = [...s.drawings].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  return `<section class="section">
    <header class="section-head">
      <h2>${icon('edit')} Desenhos experimentais</h2>
      <button class="btn btn-soft" data-action="new-drawing">${icon('plus')} Novo desenho</button>
    </header>
    ${
      list.length
        ? `<div class="drawing-grid">${list
            .map(
              (d) => `<a class="card drawing-card" href="#/planejamento?aba=experimental&desenho=${d.id}">
          <div class="thumb">${drawing.thumbnail(d.shapes)}</div>
          <strong>${esc(d.title)}</strong>
          <small class="muted">${[expName[d.experimentId], d.updatedAt ? 'editado ' + fmtDate(localISO(d.updatedAt)) : ''].filter(Boolean).map(esc).join(' · ')}</small>
        </a>`
            )
            .join('')}</div>`
        : emptyState('Monte o desenho do seu experimento com formas, setas e texto, como no PowerPoint. Há modelos prontos de linha do tempo e de grupos.', 'new-drawing', 'Criar primeiro desenho')
    }
  </section>`;
}

function experimental(params) {
  const s = store.get();
  const filter = params.get('exp') || '';
  const expName = Object.fromEntries(s.experiments.map((e) => [e.id, e.title]));
  const logs = [...s.logs]
    .filter((l) => !filter || l.experimentId === filter)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  return `<div class="section-head">
      <h2>${icon('flask')} Experimentos</h2>
      <button class="btn btn-primary" data-action="add" data-col="experiments">${icon('plus')} Novo experimento</button>
    </div>
    <section class="section">
      ${
        s.experiments.length
          ? `<div class="exp-grid">${s.experiments.map((e) => expCard(e, s)).join('')}</div>`
          : emptyState('Cadastre um experimento para acompanhar Desenho → Coleta → Análise → Escrita.', 'add-experiments', 'Novo experimento')
      }
    </section>

    ${drawingsSection(s, expName)}

    <div class="grid-2">
      <section class="section">
        <header class="section-head">
          <h2>${icon('note')} Diário de bancada</h2>
          <div class="head-actions">
            <select class="select-sm" data-filter="exp" aria-label="Filtrar por experimento">
              <option value="">Todos os experimentos</option>
              ${s.experiments.map((e) => `<option value="${e.id}" ${filter === e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}
            </select>
            <button class="btn btn-soft" data-action="add" data-col="logs">${icon('plus')} Registro</button>
          </div>
        </header>
        ${
          logs.length
            ? `<ul class="log-list">${logs
                .map(
                  (l) => `<li class="log">
              <div class="log-date"><b>${fmtDate(l.date, { day: '2-digit' })}</b><span>${fmtDate(l.date, { month: 'short' })}</span></div>
              <div class="log-body">
                ${l.experimentId ? `<small class="tag">${esc(expName[l.experimentId] || '')}</small>` : ''}
                <p class="pre">${esc(l.did)}</p>
                ${l.issues ? `<p class="log-issue pre">⚠︎ ${esc(l.issues)}</p>` : ''}
                ${l.next ? `<p class="log-next">→ ${esc(l.next)}</p>` : ''}
              </div>
              ${rowActions('logs', l.id)}
            </li>`
                )
                .join('')}</ul>`
            : emptyState('Anote o que fez na bancada, mesmo que curto. Isso vira sua metodologia depois.', 'add-logs', 'Primeiro registro')
        }
      </section>

      <div class="stack">
        <section class="section">
          <header class="section-head">
            <h2>${icon('shield')} Ética (CEUA / CEP)</h2>
            <button class="btn btn-soft" data-action="add" data-col="ethics">${icon('plus')} Protocolo</button>
          </header>
          ${
            s.ethics.length
              ? s.ethics
                  .map((e) => {
                    const pct = e.approved ? (Number(e.used || 0) / Number(e.approved)) * 100 : 0;
                    const n = daysUntil(e.validUntil);
                    return `<article class="card ethics">
                <div class="ethics-top"><div><strong>${esc(e.kind)} ${esc(e.number)}</strong><p class="muted">${esc(e.title || '')}</p></div>${rowActions('ethics', e.id)}</div>
                ${e.validUntil ? `<p class="small">Validade: ${fmtDate(e.validUntil)} ${badge(e.validUntil)}${n !== null && n <= 60 && n >= 0 ? ' <span class="hint-warn">pense na renovação</span>' : ''}</p>` : ''}
                ${e.approved ? `<div class="pace-row"><span>Utilizados</span><b>${e.used || 0} / ${e.approved}</b></div>${progressBar(pct, pct > 85 ? 'bar-warn' : '')}` : ''}
              </article>`;
                  })
                  .join('')
              : emptyState('Registre o número e a validade do protocolo para não ser pego de surpresa.', 'add-ethics', 'Protocolo de ética')
          }
        </section>

        <section class="section">
          <header class="section-head">
            <h2>${icon('paper')} Protocolos (POPs)</h2>
            <button class="btn btn-soft" data-action="add" data-col="protocols">${icon('plus')} POP</button>
          </header>
          ${
            s.protocols.length
              ? `<ul class="rows">${s.protocols
                  .map(
                    (p) => `<li class="row">
                <div class="row-main">
                  <strong>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</strong>
                  <small class="muted">${esc(p.version || '')}${p.date ? ' · ' + fmtDate(p.date) : ''}${p.experimentId ? ' · ' + esc(expName[p.experimentId] || '') : ''}</small>
                  ${p.changes ? `<small class="muted">Mudou: ${esc(p.changes)}</small>` : ''}
                </div>${rowActions('protocols', p.id)}</li>`
                  )
                  .join('')}</ul>`
              : emptyState('Guarde seus POPs com versão: quando algo mudar, você sabe o que e quando.', 'add-protocols', 'Adicionar POP')
          }
        </section>
      </div>
    </div>`;
}

function expCard(e, s) {
  const pr = experimentProgress(e);
  const ethics = s.ethics.find((x) => x.id === e.ethicsId);
  const logs = s.logs.filter((l) => l.experimentId === e.id).length;
  const tasks = s.tasks.filter((t) => t.experimentId === e.id && !t.done).length;
  const drawings = s.drawings.filter((d) => d.experimentId === e.id);
  const arts = s.articles.filter((a) => a.experimentId === e.id).length;
  return `<article class="card exp-card">
    <header class="exp-head">
      <span class="tile-ico">${icon('flask')}</span>
      <div class="exp-title"><h3>${esc(e.title)}</h3>${e.deadline ? `<small class="muted">Meta: ${fmtDate(e.deadline)} ${badge(e.deadline, pr === 100)}</small>` : ''}</div>
      ${rowActions('experiments', e.id)}
    </header>
    ${e.objective ? `<p class="muted pre clamp">${esc(e.objective)}</p>` : ''}
    <div class="stages" role="group" aria-label="Etapas">
      ${stagesOf(e)
        .map(
          (st) => `<button class="stage st-${st.status}" data-action="cycle-stage" data-id="${e.id}" data-stage="${st.name}" title="${STAGE_STATUS[st.status]}. Clique para mudar">
          <span class="stage-dot">${st.status === 'done' ? icon('check') : ''}</span>${st.name}</button>`
        )
        .join('')}
    </div>
    ${progressBar(pr)}
    <footer class="exp-foot">
      ${e.groups ? `<span>${esc(e.groups)}${e.n ? ` · n=${esc(e.n)}` : ''}</span>` : ''}
      ${ethics ? `<span>${icon('shield')} ${esc(ethics.kind)} ${esc(ethics.number)}</span>` : ''}
      <a href="#/planejamento?aba=experimental&exp=${e.id}">${icon('note')} ${logs} registros</a>
      <span>${icon('check')} ${tasks} tarefas</span>
      ${arts ? `<a href="#/acervo?s=biblioteca&exp=${e.id}">${icon('book')} ${arts} artigo(s)</a>` : ''}
      ${
        drawings.length
          ? `<a href="#/planejamento?aba=experimental&desenho=${drawings[0].id}">${icon('edit')} ${drawings.length} desenho(s)</a>`
          : `<button class="link-btn dark" data-action="new-drawing" data-exp="${e.id}">${icon('edit')} desenhar</button>`
      }
      <button class="link-btn dark" data-action="add-log-for" data-id="${e.id}">${icon('plus')} registro</button>
    </footer>
  </article>`;
}

return { title, render, mount };
})();

// ===== js/views/advisor.js =====
const __m_views_advisor = (() => {
const { store } = __m_store;
const { esc, icon, fmtDate, badge, rowActions, emptyState, todayISO } = __m_ui;
const { nextMeeting, lastMeeting } = __m_metrics;

const title = 'Orientação';

function render(params) {
  const s = store.get();
  const p = s.profile;
  const showDone = params.get('feitas') === '1';
  const expName = Object.fromEntries(s.experiments.map((e) => [e.id, e.title]));
  const tasks = [...s.tasks]
    .filter((t) => showDone || !t.done)
    .sort((a, b) => (a.done - b.done) || (a.due || '9999').localeCompare(b.due || '9999'));
  const t = todayISO();
  const upcoming = s.meetings.filter((m) => m.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  const past = s.meetings.filter((m) => m.date < t).sort((a, b) => b.date.localeCompare(a.date));
  const nm = nextMeeting();
  const lm = lastMeeting();

  return `<div class="page">
    <header class="page-head">
      <div><p class="eyebrow dark">Orientação</p><h1>Reuniões e tarefas</h1>
      <p class="muted">${p.advisor ? `Orientação: <b>${esc(p.advisor)}</b>` : 'Cadastre seu orientador em Vida acadêmica.'}${p.coadvisor ? ` · Coorientação: <b>${esc(p.coadvisor)}</b>` : ''}</p></div>
      <button class="btn btn-primary" data-action="add" data-col="meetings">${icon('plus')} Nova reunião</button>
    </header>

    ${
      nm || lm
        ? `<section class="card prep">
      <div>
        <h2>Prepare a próxima conversa</h2>
        <p class="muted">${nm ? `Reunião ${badge(nm.date)} (${fmtDate(nm.date)}).` : 'Nenhuma reunião marcada.'} Leve o que foi combinado da última vez e o que travou.</p>
      </div>
      <div class="prep-cols">
        <div><h4>Combinado na última</h4><p class="pre">${esc(lm?.decisions || '—')}</p></div>
        <div><h4>Tarefas em aberto</h4><p>${s.tasks.filter((x) => !x.done).length} pendente(s), ${s.tasks.filter((x) => !x.done && x.due && x.due < t).length} atrasada(s)</p></div>
        ${nm ? `<div><h4>Pauta</h4><p class="pre">${esc(nm.agenda || '—')}</p><button class="link-btn dark" data-action="edit" data-col="meetings" data-id="${nm.id}">${icon('edit')} editar pauta</button></div>` : ''}
      </div>
    </section>`
        : ''
    }

    <div class="grid-2">
      <section class="section">
        <header class="section-head">
          <h2>${icon('check')} Tarefas</h2>
          <div class="head-actions">
            <a class="mini-link" href="#/orientacao${showDone ? '' : '?feitas=1'}">${showDone ? 'Ocultar concluídas' : 'Mostrar concluídas'}</a>
            <button class="btn btn-soft" data-action="add" data-col="tasks">${icon('plus')} Tarefa</button>
          </div>
        </header>
        ${
          tasks.length
            ? `<ul class="rows">${tasks
                .map(
                  (x) => `<li class="row task ${x.done ? 'is-done' : ''}">
              <button class="checkbox ${x.done ? 'checked' : ''}" data-action="toggle-task" data-id="${x.id}" aria-label="${x.done ? 'Reabrir' : 'Concluir'}">${x.done ? icon('check') : ''}</button>
              <div class="row-main"><strong>${esc(x.title)}</strong>
              <small class="muted">${[expName[x.experimentId], x.origin].filter(Boolean).map(esc).join(' · ')}</small></div>
              ${x.due ? badge(x.due, x.done) : ''}
              ${rowActions('tasks', x.id)}</li>`
                )
                .join('')}</ul>`
            : emptyState('Nenhuma tarefa aberta. 🎉', 'add-tasks', 'Nova tarefa')
        }
      </section>

      <section class="section">
        <header class="section-head"><h2>${icon('users')} Reuniões</h2></header>
        ${upcoming.length ? `<h3 class="sub">Próximas</h3>${upcoming.map(meetingCard).join('')}` : ''}
        ${past.length ? `<h3 class="sub">Histórico</h3>${past.map(meetingCard).join('')}` : ''}
        ${!s.meetings.length ? emptyState('Registre cada reunião: o que foi decidido vira histórico e as tarefas entram na sua lista.', 'add-meetings', 'Registrar reunião') : ''}
      </section>
    </div>
  </div>`;
}

function meetingCard(m) {
  return `<article class="card meeting">
    <div class="meeting-top">
      <div class="date-chip"><b>${fmtDate(m.date, { day: '2-digit' })}</b><span>${fmtDate(m.date, { month: 'short' })}</span></div>
      <div class="row-main"><strong>${esc(m.with || 'Reunião de orientação')}</strong><small class="muted">${fmtDate(m.date)} · ${badge(m.date)}</small></div>
      ${rowActions('meetings', m.id)}
    </div>
    ${m.agenda ? `<div class="meeting-block"><h4>Pauta</h4><p class="pre">${esc(m.agenda)}</p></div>` : ''}
    ${m.decisions ? `<div class="meeting-block"><h4>Decisões</h4><p class="pre">${esc(m.decisions)}</p></div>` : ''}
  </article>`;

const __m_views_timeline = (() => {
const { store } = __m_store;
const { esc, icon, fmtDate, badge, daysUntil, urgency, emptyState, todayISO } = __m_ui;
const { agenda, timeElapsed } = __m_metrics;

const title = 'Prazos';

function render(params) {
  const s = store.get();
  const p = s.profile;
  const showDone = params.get('feitos') === '1';
  const items = agenda({ includeDone: showDone });
  const late = items.filter((a) => !a.done && daysUntil(a.date) < 0);
  const future = items.filter((a) => a.done || daysUntil(a.date) >= 0);

  // agrupar por mês
  const groups = {};
  future.forEach((a) => {
    const k = a.date.slice(0, 7);
    (groups[k] ||= []).push(a);
  });

  return `<div class="page">
    <header class="page-head">
      <div><p class="eyebrow dark">Linha do tempo</p><h1>Prazos e marcos</h1></div>
      <button class="btn btn-primary" data-action="add" data-col="milestones">${icon('plus')} Novo prazo</button>
    </header>

    ${courseLine(p, s.milestones)}

    <div class="section-head between">
      <h2>Agenda</h2>
      <a class="mini-link" href="#/prazos${showDone ? '' : '?feitos=1'}">${showDone ? 'Ocultar concluídos' : 'Mostrar concluídos'}</a>
    </div>

    ${
      late.length
        ? `<section class="card late-box"><h3>${icon('clock')} Atrasados (${late.length})</h3><ul class="rows">${late.map(row).join('')}</ul></section>`
        : ''
    }

    ${
      Object.keys(groups).length
        ? Object.entries(groups)
            .map(
              ([k, list]) => `<section class="month">
          <h3 class="month-title">${cap(fmtDate(k + '-01', { month: 'long', year: 'numeric' }))}</h3>
          <ul class="rows">${list.map(row).join('')}</ul></section>`
            )
            .join('')
        : emptyState('Sem prazos futuros. Cadastre qualificação, relatórios e submissões.', 'add-milestones', 'Novo prazo')
    }
  </div>`;
}

const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

function row(a) {
  const canToggle = a.col === 'tasks' || a.col === 'milestones' || a.col === 'assessments';
  return `<li class="row agenda-row u-${urgency(a.date, a.done)} ${a.done ? 'is-done' : ''}">
    <div class="date-chip small"><b>${fmtDate(a.date, { day: '2-digit' })}</b><span>${fmtDate(a.date, { month: 'short' })}</span></div>
    <div class="row-main"><strong>${esc(a.title)}</strong><small class="muted"><span class="tag">${esc(a.kind)}</span> ${esc(a.sub || '')}</small></div>
    ${badge(a.date, a.done)}
    ${
      canToggle
        ? `<button class="icon-btn" title="${a.done ? 'Reabrir' : 'Marcar como concluído'}" data-action="toggle-done" data-col="${a.col}" data-id="${a.id}">${icon('check')}</button>`
        : ''
    }
    ${a.col ? `<button class="icon-btn" title="Editar" data-action="edit" data-col="${a.col}" data-id="${a.id}">${icon('edit')}</button>` : `<button class="icon-btn" title="Editar projeto" data-action="edit-profile">${icon('edit')}</button>`}
  </li>`;
}

function courseLine(p, milestones) {
  if (!p?.start || !p?.end) return '';
  const total = daysUntil(p.end) - daysUntil(p.start);
  const pos = (iso) => Math.max(0, Math.min(100, ((-daysUntil(p.start) + daysUntil(iso)) / total) * 100));
  const now = timeElapsed(p);
  const marks = milestones.filter((m) => m.date >= p.start && m.date <= p.end);
  // anos
  const years = [];
  const y0 = Number(p.start.slice(0, 4)), y1 = Number(p.end.slice(0, 4));
  for (let y = y0 + 1; y <= y1; y++) years.push(`${y}-01-01`);
  return `<section class="card course-line">
    <div class="cl-head"><span>Ingresso · ${fmtDate(p.start)}</span><span>Defesa · ${fmtDate(p.end)}</span></div>
    <div class="cl-track">
      <div class="cl-fill" style="width:${now}%"></div>
      ${years.map((y) => `<span class="cl-year" style="left:${pos(y)}%">${y.slice(0, 4)}</span>`).join('')}
      ${marks
        .map(
          (m) => `<button class="cl-mark ${m.done ? 'done' : ''} u-${urgency(m.date, m.done)}" style="left:${pos(m.date)}%" data-action="edit" data-col="milestones" data-id="${m.id}" title="${esc(m.title)} · ${fmtDate(m.date)}">
          <span class="cl-label">${esc(m.title)}</span></button>`
        )
        .join('')}
      <span class="cl-now" style="left:${now}%"><span>hoje</span></span>
    </div>
  </section>`;
}

return { title, render };
})();

const __m_views_academic = (() => {

            : `<button class="btn btn-soft full" data-action="edit-profile">${icon('plus')} Cadastrar orientador</button>`
        }
      </section>
      <section class="card">
        <h3 class="sub">Curso</h3>
        ${p.institution ? `<p><b>${esc(p.institution)}</b></p>` : `<button class="btn btn-soft full" data-action="edit-profile">${icon('plus')} Adicionar instituição</button>`}

        <p>Defesa prevista: <b>${fmtDate(p.end)}</b> ${badge(p.end)}</p>
      </section>
      <section class="card">
        <h3 class="sub">Bolsa</h3>
        ${
          p.scholarship

            : `<p class="muted">Sem bolsa cadastrada.</p>`
        }
      </section>
    </div>

    <section class="section">
      <header class="section-head">
        <h2>${icon('book')} Disciplinas cursadas</h2>
        <div class="head-actions"><a class="mini-link" href="#/planejamento?aba=academico">Provas e trabalhos ${icon('arrow')}</a><button class="btn btn-soft" data-action="add" data-col="courses">${icon('plus')} Disciplina</button></div>
      </header>
      ${creditCards(cr)}
      ${
        courses.length
          ? `<div class="table-wrap"><table class="table">
          <thead><tr><th>Disciplina</th><th>Tipo</th><th>Semestre</th><th>Créditos</th><th>Situação</th><th>Conceito</th><th></th></tr></thead>
          <tbody>${courses
            .map(
              (c) => `<tr>
              <td><a href="#/planejamento?aba=academico&disc=${c.id}">${esc(c.name)}</a></td>
              <td><span class="pill type-${courseType(c)}">${courseType(c) === 'optativa' ? 'Optativa' : 'Obrigatória'}</span></td>
              <td>${esc(c.term || '—')}</td><td>${esc(c.credits)}</td>
              <td><span class="pill status-${c.status}">${{ cursando: 'Cursando', concluida: 'Concluída', planejada: 'Planejada' }[c.status] || ''}</span></td>

          : emptyState('Adicione suas disciplinas para acompanhar os créditos. Guarde o link da ementa: concursos pedem.', 'add-courses', 'Adicionar disciplina')
      }
    </section>
  </div>`;
}

function creditBlock(label, c) {
  const note = c.req
    ? c.done >= c.req
      ? 'Completo ✓'
      : `Faltam ${c.missing}`
    : 'Exigência não informada';
  return `<div class="credit-block">
    <div class="pace-row"><span>${label}</span><b>${c.done}${c.req ? ` / ${c.req}` : ''}</b></div>
    ${progressBar(c.pct, c.req && c.done >= c.req ? '' : '')}
    <small class="muted">${note}${c.ongoing ? ` · ${c.ongoing} em curso` : ''}</small>
  </div>`;
}

function creditCards(cr) {
  if (!cr.split && !cr.total.req) {
    return `<div class="card soft credits-card"><div class="pace-row"><span>Créditos concluídos</span><b>${cr.total.done}</b></div>
      <small class="muted">Informe os créditos exigidos em obrigatórias e optativas em <button class="link-inline" data-action="edit-profile">Editar dados</button>.</small></div>`;
  }
  if (!cr.split) {
    return `<div class="card soft credits-card">${creditBlock('Créditos concluídos', cr.total)}
      <small class="muted">Separe a exigência entre obrigatórias e optativas em <button class="link-inline" data-action="edit-profile">Editar dados</button>.</small></div>`;
  }
  return `<div class="card soft credits-card credits-split">
    ${creditBlock('Obrigatórias', cr.mand)}
    ${creditBlock('Optativas', cr.elec)}
    <div class="credit-total"><span>Total</span><b>${cr.mand.done + cr.elec.done} / ${cr.total.req}</b>
      <small class="muted">${cr.total.missing ? `faltam ${cr.total.missing} créditos` : 'créditos completos ✓'}</small></div>
  </div>`;
}

return { title, render, creditCards };
})();

// ===== js/views/library.js =====
const __m_views_library = (() => {
// Biblioteca de artigos: busca no PubMed e no SciELO, cadastro por DOI/PMID,
// fichamento, status de leitura e referências ABNT/Vancouver.
const { store } = __m_store;
const { esc, icon, toast, emptyState } = __m_ui;
const lit = __m_lit;

const READ_STATUS = [
  ['ler', 'Quero ler'],
  ['lendo', 'Lendo'],
  ['lido', 'Lido'],
];
const statusLabel = (s) => Object.fromEntries(READ_STATUS)[s] || 'Quero ler';
const SOURCE = { pubmed: 'PubMed', scielo: 'SciELO', crossref: 'DOI', manual: 'Manual' };

// Estado da busca (fica fora do store: são resultados temporários)
const S = {
  q: '',
  source: 'ambos',
  sort: 'relevance',
  from: '',
  loading: false,
  error: '',
  results: [], // [{...artigo, _key}]
  totals: {},
  offsets: { pubmed: 0, scielo: 0 },
  open: {}, // resumos abertos nos resultados
  abstracts: {}, // pmid -> resumo carregado
  lookupBusy: false,
  lookupError: '',
};
const rerender = () => window.dispatchEvent(new Event('app:rerender'));

function savedMatch(a) {
  return store
    .list('articles')
    .find((x) => (a.pmid && x.pmid === a.pmid) || (a.doi && x.doi && x.doi.toLowerCase() === a.doi.toLowerCase()));
}

function citation(a) {
  return `${esc(lit.shortAuthors(a.authors))}${a.authors ? ' · ' : ''}<i>${esc(a.journal || a.journalAbbr || '')}</i>${a.year ? ' · ' + esc(a.year) : ''}`;
}

function sourceBadge(a) {
  return `<span class="src src-${a.source || 'manual'}">${SOURCE[a.source] || 'Manual'}</span>`;
}

function links(a) {
  return [
    a.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(a.pmid)}/" target="_blank" rel="noopener">PubMed</a>` : '',
    a.pmcid ? `<a href="https://pmc.ncbi.nlm.nih.gov/articles/${esc(a.pmcid)}/" target="_blank" rel="noopener">Texto completo (PMC)</a>` : '',
    a.doi ? `<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">${a.source === 'scielo' ? 'Texto completo (SciELO)' : 'DOI'}</a>` : '',
    !a.pmid && !a.doi && a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a>` : '',
  ]
    .filter(Boolean)
    .join('');
}

// ---------- Busca ----------
function searchBox() {
  return `<section class="card lib-search">
    <form id="lib-form" class="lib-form" autocomplete="off">
      <div class="lib-q">
        ${icon('paper')}
        <input name="q" type="search" placeholder="Buscar artigos. Ex.: chronic stress intestinal permeability" value="${esc(S.q)}" aria-label="Termos da busca" />
        <button class="btn btn-primary" type="submit" ${S.loading ? 'disabled' : ''}>${S.loading ? 'Buscando…' : 'Buscar'}</button>
      </div>
      <div class="lib-opts">
        <div class="seg" role="radiogroup" aria-label="Onde buscar">
          ${[
            ['ambos', 'PubMed + SciELO'],

            ['scielo', 'SciELO'],
          ]

        </label>
      </div>
      <p class="lib-tip">Dica: no PubMed, use termos em inglês. No SciELO, português funciona bem. No PubMed, aspas buscam a expressão exata.</p>
    </form>
    <div class="lib-or"><span>ou</span></div>
    <form id="lib-lookup" class="lib-lookup" autocomplete="off">
      <label for="lib-id">Adicionar pelo DOI, PMID ou link</label>

        <input id="lib-id" name="id" placeholder="Ex.: 10.1590/S0004-28032019000200004  ou  33176074" />
        <button class="btn btn-soft" type="submit" ${S.lookupBusy ? 'disabled' : ''}>${S.lookupBusy ? 'Buscando…' : `${icon('plus')} Adicionar`}</button>
      </div>

function results() {
  if (S.error) return `<div class="lib-err box">${esc(S.error)}</div>`;

  const totals = Object.entries(S.totals)

            </div>
          </li>`;
            })
            .join('')}</ul>
          <p class="muted small" id="lib-nomatch" hidden>Nenhum artigo da biblioteca bate com esse filtro.</p>`
        : all.length
        ? `<div class="empty small"><p>Nenhum artigo nesse filtro.</p></div>`
        : emptyState('Sua biblioteca está vazia. Busque acima ou cole um DOI/PMID. Cada artigo salvo ganha fichamento, status de leitura e referência ABNT pronta.', '', '')
    }
  </section>`;
}

function render(params) {
  return `<div class="lib">${searchBox()}${results()}${library(params)}</div>`;
}

// ---------- Ações ----------
async function runSearch(more = false) {
  if (!S.q.trim()) return;
  S.loading = true;
  S.error = '';
  if (!more) {
    S.fallback = false;
    S.results = [];
    S.totals = {};
    S.offsets = { pubmed: 0, scielo: 0 };
    S.open = {};
  }
  rerender();
  const rows = S.source === 'ambos' ? 10 : 20;
  const opts = (k) => ({ start: S.offsets[k], rows, sort: S.sort, from: S.from });
  const jobs = [];
  const want = (k) => S.source === 'ambos' || S.source === k;
  const add = (k, p) =>
    jobs.push(
      p.then((r) => {
        S.totals[k] = r.total;
        if (r.fallback) S.fallback = true;
        S.offsets[k] += r.items.length;
        return r.items;
      })
    );
  if (want('pubmed') && (!more || S.offsets.pubmed < (S.totals.pubmed ?? Infinity))) add('pubmed', lit.pubmedSearch(S.q, opts('pubmed')));
  if (want('scielo') && (!more || S.offsets.scielo < (S.totals.scielo ?? Infinity))) add('scielo', lit.scieloSearch(S.q, opts('scielo')));
  const settled = await Promise.allSettled(jobs);
  const lists = settled.filter((x) => x.status === 'fulfilled').map((x) => x.value);
  const errors = settled.filter((x) => x.status === 'rejected').map((x) => x.reason?.message);
  // intercala as fontes para não ficar tudo de uma só no topo
  const merged = [];
  const max = Math.max(0, ...lists.map((l) => l.length));
  for (let i = 0; i < max; i++) lists.forEach((l) => l[i] && merged.push(l[i]));
  const seen = new Set(S.results.map((r) => r._key));
  merged.forEach((a) => {
    a._key = lit.articleKey(a);
    if (a.doi && S.results.some((r) => r.doi && r.doi.toLowerCase() === a.doi.toLowerCase())) return;
    if (!seen.has(a._key)) {
      seen.add(a._key);
      S.results.push(a);
    }
  });
  if (S.fallback && !more) toast('A cota diária grátis do OpenAlex acabou nesta rede. Usei a busca reserva do SciELO, que é menos precisa. Veja Configurações.');
  if (errors.length && !lists.length) S.error = errors[0];
  else if (errors.length) toast(`Uma das bases não respondeu: ${errors[0]}`);
  S.loading = false;
  rerender();
}

async function saveArticle(a) {
  if (savedMatch(a)) return toast('Este artigo já está na sua biblioteca');
  let data = { ...a };
  delete data._key;
  if (data.source === 'scielo' && data.doi) data = await lit.enrichFromCrossref(data);
  if (data.pmid && !data.abstract) {
    try {
      Object.assign(data, await lit.pubmedAbstract(data.pmid));
    } catch (e) {
      /* salva sem resumo */
    }
  }
  store.add('articles', { ...data, status: 'ler', cite: false, tags: '', notes: '', experimentId: '', courseId: '' });
  toast('Salvo na biblioteca');
}

async function copyRef(a, kind) {
  const text = kind === 'abnt' ? lit.abnt(a) : lit.vancouver(a);
  try {
    if (kind === 'abnt' && window.ClipboardItem) {
      const html = lit.abnt(a, { html: true });
      await navigator.clipboard.write([
        new ClipboardItem({ 'text/plain': new Blob([text], { type: 'text/plain' }), 'text/html': new Blob([html], { type: 'text/html' }) }),
      ]);
    } else await navigator.clipboard.writeText(text);
    toast(kind === 'abnt' ? 'Referência ABNT copiada (com o periódico em negrito)' : 'Referência Vancouver copiada');
  } catch (e) {
    window.prompt('Copie a referência:', text);
  }
}

function mount() {
  lit.setOpenAlexKey(store.get().profile?.openalexKey);
  const root = document.querySelector('.lib');
  if (!root) return null;

  root.querySelector('#lib-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    S.q = f.q.value.trim();
    S.source = f.source.value;
    S.sort = f.sort.value;
    S.from = f.from.value.trim();
    if (!S.q) return f.q.focus();
    runSearch();
  });
  root.querySelector('#lib-form')?.addEventListener('change', (e) => {
    if (e.target.name === 'source') {
      root.querySelectorAll('.seg label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
    }
  });

  root.querySelector('#lib-lookup')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = e.target.id.value;
    S.lookupError = '';
    S.lookupBusy = true;
    rerender();
    try {
      const a = await lit.lookup(v);
      const dup = savedMatch(a);
      S.lookupBusy = false;
      if (dup) {
        toast('Este artigo já está na sua biblioteca');
        rerender();
        return;
      }
      store.add('articles', { ...a, status: 'ler', cite: false, tags: '', notes: '', experimentId: '', courseId: '' });
      toast(`Adicionado: ${a.title.slice(0, 60)}${a.title.length > 60 ? '…' : ''}`);
    } catch (err) {
      S.lookupBusy = false;
      S.lookupError = err.message;
      rerender();
      document.getElementById('lib-id').value = v;
    }
  });

  root.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-lib]');
    if (!b) return;
    const act = b.dataset.lib;
    if (act === 'clear') {
      Object.assign(S, { q: '', results: [], totals: {}, error: '', open: {} });
      rerender();
    }
    if (act === 'more') runSearch(true);
    if (act === 'save') {
      b.disabled = true;
      b.textContent = 'Salvando…';
      await saveArticle(S.results[Number(b.dataset.i)]);
    }
    if (act === 'toggle-abs') {
      const a = S.results[Number(b.dataset.i)];
      S.open[a._key] = !S.open[a._key];
      rerender();
      if (S.open[a._key] && a.pmid && !a.abstract && S.abstracts[a.pmid] === undefined) {
        try {
          const r = await lit.pubmedAbstract(a.pmid);
          S.abstracts[a.pmid] = r.abstract;
        } catch (err) {
          S.abstracts[a.pmid] = '';
        }
        rerender();
      }
    }
    if (act === 'copy-abnt' || act === 'copy-vanc') {
      const a = store.find('articles', b.dataset.id);
      if (a) copyRef(a, act === 'copy-abnt' ? 'abnt' : 'vanc');
    }
  });

  root.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.lib === 'status') {
      store.update('articles', el.dataset.id, { status: el.value });
      toast(`Marcado como “${statusLabel(el.value)}”`);
    }
  });

  const filter = root.querySelector('#lib-filter');
  filter?.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    let shown = 0;
    root.querySelectorAll('#lib-list > li').forEach((li) => {
      const ok = !q || li.dataset.hay.includes(q);
      li.hidden = !ok;
      if (ok) shown++;
    });
    const nm = root.querySelector('#lib-nomatch');
    if (nm) nm.hidden = shown > 0;
  });

  return null;
}

return { READ_STATUS, render, mount };
})();

function certificates(s) {

  const total = s.certificates.reduce((a, c) => a + (Number(c.hours) || 0), 0);
  const byKind = {};
  s.certificates.forEach((c) => (byKind[c.kind] = (byKind[c.kind] || 0) + (Number(c.hours) || 0)));

        )
        .join('')}</ul>`;
    })

// Texto organizado nas seções do Currículo Lattes, pronto para copiar.
function lattesText() {
  const s = store.get();
  const yr = (d) => (d ? d.slice(0, 4) : '');
  const lines = [];
  const pub = s.papers.filter((p) => ['aceito', 'publicado'].includes(p.status));
  if (pub.length) {
    lines.push('ARTIGOS COMPLETOS PUBLICADOS / ACEITOS');
    pub.forEach((p, i) =>
      lines.push(`${i + 1}. ${p.authors || ''}. ${p.title}. ${p.journal || ''}${p.year ? ', ' + p.year : ''}${p.doi ? '. DOI: ' + p.doi : ''}${p.status === 'aceito' ? ' (aceito para publicação)' : ''}.`)
    );
    lines.push('');
  }
  const today = todayISO();
  const pres = s.congresses.filter((c) => c.format && c.format !== 'ouvinte' && c.work && c.date && c.date <= today);
  if (pres.length) {
    lines.push('APRESENTAÇÕES DE TRABALHO');
    pres.forEach((c, i) => lines.push(`${i + 1}. ${s.profile.name}. ${c.work}. ${c.format === 'oral' ? 'Apresentação oral' : 'Pôster'}. ${c.event}${c.place ? ', ' + c.place : ''}, ${yr(c.date)}.`));
    lines.push('');
  }
  const groups = { curso: 'CURSOS DE CURTA DURAÇÃO REALIZADOS', congresso: 'PARTICIPAÇÃO EM EVENTOS', apresentacao: 'PARTICIPAÇÃO EM EVENTOS (COM APRESENTAÇÃO)', banca: 'PARTICIPAÇÃO EM BANCAS', monitoria: 'ATIVIDADES DE ENSINO / MONITORIA', premio: 'PRÊMIOS E TÍTULOS', outro: 'OUTRAS ATIVIDADES' };
  Object.entries(groups).forEach(([k, label]) => {
    const list = s.certificates.filter((c) => c.kind === k);
    if (!list.length) return;
    lines.push(label);
    list.forEach((c, i) => lines.push(`${i + 1}. ${c.title}${c.hours ? ` (carga horária: ${c.hours} h)` : ''}, ${yr(c.date)}.`));
    lines.push('');
  });
  const done = s.courses.filter((c) => c.status === 'concluida');
  if (done.length) {
    lines.push('DISCIPLINAS CURSADAS');
    done.forEach((c) => lines.push(`- ${c.name} (${c.credits} créditos${c.grade ? ', conceito ' + c.grade : ''}${c.term ? ', ' + c.term : ''})`));
  }
  return lines.join('\n').trim() || 'Ainda não há itens suficientes no acervo para gerar o texto.';
}

return { title, mount, render, lattesText };
})();

      }
      if (kind === 'newpass') {
        await cloud.setNewPassword(password);
        S.mode = 'login';
      }
    } catch (err) {
      S.err = err.message;
    }
    S.busy = false;
    rerender();
    setTimeout(() => document.querySelector('.auth input[name="password"]')?.focus(), 0);
  });
  setTimeout(() => {
    const first = root.querySelector('input:not([value]), input[value=""]') || root.querySelector('input');
    first?.focus();
  }, 0);
  return null;
}

// Indicador de sincronização na barra do topo
function syncBadge(c) {
  const map = {
    synced: ['ok', 'Salvo na nuvem'],
    pending: ['wait', 'Salvando…'],
    saving: ['wait', 'Salvando…'],
    syncing: ['wait', 'Sincronizando…'],
    offline: ['off', 'Sem internet: salvo neste aparelho'],
    error: ['bad', 'Erro ao sincronizar'],
    conflict: ['bad', 'Precisa da sua decisão'],
  };
  const [tone, text] = map[c.status] || ['', ''];
  if (!tone) return '';
  return `<a href="#/config" class="sync sync-${tone}" title="${esc(c.error || text)}"><span class="sync-dot"></span><span class="sync-text">${text}</span></a>`;
}

function conflictDialog(c) {
  if (!c.conflict) return '';
  const when = new Date(c.conflict.remote.updated_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  const first = c.conflict.firstLogin;
  return `<div class="modal-backdrop conflict" role="alertdialog" aria-modal="true" aria-labelledby="cf-t">
    <div class="modal modal-sm">
      <h2 id="cf-t">${first ? 'Sua conta já tem dados' : 'Alterações em dois aparelhos'}</h2>
      <p class="confirm-text">${
        first
          ? `Este navegador tem dados que não estão na sua conta, e a sua conta já tem dados salvos (última alteração em ${when}). Qual versão você quer manter?`
          : `Você mudou coisas neste aparelho, e outro aparelho também salvou alterações (em ${when}). Qual versão você quer manter?`
      }</p>
      <div class="cf-actions">
        <button class="btn btn-primary" data-conflict="cloud">Usar a da nuvem${first ? ' (da minha conta)' : ''}</button>
        <button class="btn btn-ghost" data-conflict="local">Usar a deste aparelho</button>
      </div>
      <p class="small muted">A versão não escolhida é substituída. Se quiser guardar as duas, antes faça um backup em Configurações.</p>
      <button class="link-inline" data-conflict="backup">Baixar backup deste aparelho antes</button>
    </div>
  </div>`;
}

return { splash, render, mount, syncBadge, conflictDialog };
})();

let lastRoute = '';
let cleanup = null;
function render() {
  if (cleanup) {
    try {
      cleanup();
    } catch (e) {
      console.warn(e);
    }
    cleanup = null;
  }
  const s = store.get();
  document.querySelectorAll('.modal-backdrop.conflict').forEach((m) => m.remove());
  if (cloudEnabled) {
    if (!cloud.ready) {
      app.innerHTML = auth.splash();
      return;
    }
    if (cloud.recovery) {
      app.innerHTML = auth.render('newpass');
      cleanup = auth.mount();
      return;
    }
    if (!cloud.user && !isLocalOnly()) {
      app.innerHTML = auth.render();
      cleanup = auth.mount();
      document.title = 'Entrar · Minha Pesquisa';
      return;
    }
    if (cloud.user && cloud.status === 'syncing' && !s.profile) {
      app.innerHTML = auth.splash('Carregando seus dados…');
      return;
    }
    if (cloud.conflict) document.body.insertAdjacentHTML('beforeend', auth.conflictDialog(cloud));
  }
  if (!s.profile) {
    app.innerHTML = welcome();
    document.title = 'Minha Pesquisa';
    return;
  }
  const { name, params } = parseHash();
  const route = ROUTES[name];
  const y = window.scrollY;
  app.innerHTML = shell(name, route.view.render(params));
  if (route.view.mount) cleanup = route.view.mount(params) || null;
  document.title = `${route.view.title || route.label} · Minha Pesquisa`;
  const key = location.hash;
  if (key !== lastRoute) window.scrollTo(0, 0);
  else window.scrollTo(0, y);
  lastRoute = key;
}

// ---------- Ações ----------
function profileForm(isNew = false) {
  const p = store.get().profile || {};
  openForm({
    title: isNew ? 'Vamos começar' : 'Editar projeto e dados',
    fields: PROFILE_FIELDS,
    values: isNew ? { level: 'mestrado', start: todayISO() } : p,
    submitLabel: isNew ? 'Criar meu painel' : 'Salvar',
    onSubmit: (v) => {
      if (!v.end && v.start) {
        const d = new Date(v.start);
        d.setFullYear(d.getFullYear() + defaultDuration(v.level));
        v.end = d.toISOString().slice(0, 10);
      }
      store.setProfile(v);
      toast(isNew ? 'Painel criado!' : 'Dados atualizados');
    },
  });
}

function addOrEdit(col, id, preset = {}) {
  const schema = SCHEMAS[col];
  if (!schema) return;
  const current = id ? store.find(col, id) : preset;
  openForm({
    title: `${id ? 'Editar' : 'Novo(a)'} ${schema.label}`,
    fields: schema.fields(),
    values: current,
    onSubmit: (v) => {
      if (col === 'meetings' && v.newTasks) {
        v.newTasks
          .split('\n')
          .map((t) => t.replace(/^[-•*\s]+/, '').trim())
          .filter(Boolean)
          .forEach((t) => store.add('tasks', { title: t, due: '', done: false, origin: `Reunião ${v.date.split('-').reverse().join('/')}` }));
        v.newTasks = '';
      }
      if (id) store.update(col, id, v);
      else store.add(col, col === 'experiments' ? { ...v, stages: { Desenho: 'doing' } } : v);
      toast(id ? 'Alterações salvas' : 'Adicionado');
    },
  });
}

function download(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
}

function showLattes() {
  closeModal();
  const text = archive.lattesText();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="lt">
    <header class="modal-head"><h2 id="lt">Texto para o Lattes</h2><button class="icon-btn" data-close aria-label="Fechar">${icon('x')}</button></header>
    <p class="muted">Organizado pelas seções do Currículo Lattes. Copie e cole em cada área da Plataforma Lattes, conferindo os dados.</p>
    <textarea class="lattes" readonly rows="16">${esc(text)}</textarea>
    <footer class="modal-foot"><button class="btn btn-ghost" data-close>Fechar</button><button class="btn btn-primary" data-copy>${icon('copy')} Copiar</button></footer>
  </div>`;
  document.body.appendChild(wrap);
  document.body.classList.add('no-scroll');
  wrap.addEventListener('click', async (e) => {
    if (e.target === wrap || e.target.closest('[data-close]')) closeModal();
    if (e.target.closest('[data-copy]')) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = wrap.querySelector('textarea');
        ta.select();
        document.execCommand('copy');
      }
      toast('Texto copiado');
    }
  });
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  let name = el.dataset.action;
  // atalhos gerados pelos estados vazios: add-<coleção>
  if (!actions[name] && name.startsWith('add-') && SCHEMAS[name.slice(4)]) {
    addOrEdit(name.slice(4));
    return;
  }
  if (actions[name]) {
    e.preventDefault();
    actions[name](el);
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.filter === 'exp') {
    location.hash = el.value ? `#/planejamento?aba=experimental&exp=${el.value}` : '#/planejamento?aba=experimental';
  }
  if (el.dataset.action === 'import' && el.files?.[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || !('profile' in data)) throw new Error('formato');
        confirmDialog('Restaurar este backup? Os dados atuais serão substituídos.', () => {
          store.replaceAll(data);
          toast('Backup restaurado');
        }, 'Restaurar');
      } catch {
        toast('Arquivo inválido: escolha um backup do Minha Pesquisa');
      }
      el.value = '';
    };
    reader.readAsText(el.files[0]);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

window.addEventListener('app:rerender', () => render());

// Mudanças da nuvem: redesenha a tela só quando muda algo estrutural (login, conflito);
// para "salvando/salvo" atualiza apenas o indicador, sem atrapalhar o que está sendo editado.
let cloudKey = '';
const keyOf = () => [cloud.ready, cloud.user?.id, cloud.recovery, !!cloud.conflict, isLocalOnly(), cloud.status === 'syncing'].join('|');
onCloudChange(() => {
  const k = keyOf();
  if (k !== cloudKey) {
    cloudKey = k;
    render();
  } else {
    const slot = document.getElementById('sync-slot');
    if (slot) slot.innerHTML = cloud.user ? auth.syncBadge(cloud) : '';
    const st = document.querySelector('[data-sync-status]');
    if (st) st.innerHTML = auth.syncBadge(cloud) || 'Desconectado';
  }
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-conflict]');
  if (!b) return;
  if (b.dataset.conflict === 'backup') {
    download(`minha-pesquisa-backup-${todayISO()}.json`, JSON.stringify(store.get(), null, 2));
    return;
  }
  resolveConflict(b.dataset.conflict);
  toast(b.dataset.conflict === 'cloud' ? 'Usando os dados da nuvem' : 'Enviando os dados deste aparelho para a nuvem');
});

window.addEventListener('hashchange', () => {
  closeModal();
  render();
});
store.subscribe(render);
render();
initCloud().then(() => {
  cloudKey = keyOf();
  render();
});

return {  };
})();

</script>
  </body>
</html>
